<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ABYSS</title>
<style>
  /* ---- Minimal page styling: center the canvas on a dark arcade backdrop ---- */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #05060a;
    color: #cfd8ff;
    font-family: "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #game {
    /* Internal resolution stays fixed at 480x640 (canvas width/height attrs).
       We CSS-scale the element to fit the viewport while preserving the 3:4
       aspect ratio (letterboxed by the flex-centered body). The logical
       coordinate system never changes — rendering always happens in 480x640. */
    image-rendering: pixelated;
    border: 2px solid #2b3a7a;
    box-shadow: 0 0 40px rgba(60, 90, 255, 0.35);
    background: #000;
    aspect-ratio: 3 / 4;
    max-width: calc(100vw - 48px);
    max-height: calc(100vh - 48px);
    width: auto;
    height: auto;
    /* Default size before either constraint kicks in. */
    width: min(calc((100vh - 48px) * 0.75), calc(100vw - 48px));
  }
  #hint {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    opacity: 0.6;
    letter-spacing: 1px;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game" width="480" height="640"></canvas>

<script>
"use strict";

/* ============================================================================
 * Galaga 3.8 — Milestone 1, Task 1.1: SFX Synthesizer + Game Scaffold
 * ----------------------------------------------------------------------------
 * A single self-contained HTML file. All audio is synthesized at runtime with
 * the Web Audio API (oscillators, gain envelopes, filters) — no external files.
 * ==========================================================================*/

/* ---------------------------------------------------------------------------
 * SfxEngine
 * -------------------------------------------------------------------------
 * Wraps an AudioContext and exposes one method per game event. Every sound is
 * built from oscillators / noise buffers routed through a gain envelope into a
 * shared master gain node (which also carries the mute flag).
 *
 * Envelope helper: `env(gainNode, t0, peak, attack, decay)` shapes a gain
 * param over time using linear ramps so there are no clicks.
 * ------------------------------------------------------------------------- */
class SfxEngine {
  constructor(ctx) {
    this.ctx = ctx;

    // Master gain: single volume knob for everything we synthesize.
    this.master = ctx.createGain();
    this.master.gain.value = 0.6;          // overall volume (0..1)
    this.master.connect(ctx.destination);

    this.muted = false;

    // Pre-build a short white-noise buffer reused by every noise-based SFX.
    // 1 second of random samples is plenty for bursts; we slice it per use.
    const len = Math.floor(ctx.sampleRate * 1.0);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    this.noiseBuffer = buf;

    // Pre-render a real explosion: white noise through a decaying lowpass, so
    // the "boom" has a sharp attack and a rumbling tail baked into the samples.
    // This is far more reliable than live oscillators for big blasts.
    const expLen = Math.floor(ctx.sampleRate * 1.2);
    const expBuf = ctx.createBuffer(1, expLen, ctx.sampleRate);
    const ed = expBuf.getChannelData(0);
    // Simple one-pole lowpass over white noise, amplitude decays exponentially.
    let lp = 0;
    const cutoff = 900;                       // rumble corner frequency
    const rc = 1 / (2 * Math.PI * cutoff);
    const dt = 1 / ctx.sampleRate;
    const alpha = dt / (rc + dt);
    for (let i = 0; i < expLen; i++) {
      const n = Math.random() * 2 - 1;
      lp += alpha * (n - lp);                 // lowpassed noise
      const t = i / ctx.sampleRate;
      const env = Math.exp(-t * 4.5);         // fast attack, long decay
      ed[i] = lp * env * 3.0;                 // boost to use full headroom
    }
    this.explosionBuffer = expBuf;
  }

  /** Toggle global mute. Returns current muted state. */
  setMute(on) {
    this.muted = !!on;
    // Ramp to avoid a hard click when toggling mid-sound.
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setTargetAtTime(this.muted ? 0 : 0.6, t, 0.01);
    return this.muted;
  }

  /* -- internal helpers ---------------------------------------------------- */

  /**
   * Apply a simple ADSR-ish envelope to a GainNode starting at time t0.
   * Linear ramp up to `peak` over `attack`, then exponential decay to ~0
   * over `decay`. ExponentialRampToValueAtTime can't target 0, so we floor it.
   */
  _env(g, t0, peak, attack, decay) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);
  }

  /** Create a source->gain chain connected to master; returns the gain node. */
  _chain(source) {
    const g = this.ctx.createGain();
    source.connect(g);
    g.connect(this.master);
    return g;
  }

  /**
   * If the AudioContext is suspended (autoplay policy, tab lost focus, etc.),
   * kick a resume. Sounds scheduled while suspended play silently, so we try
   * to wake the context on every SFX. Browsers only allow resume from a user
   * gesture, but calling it here is harmless and catches the common case where
   * the context dropped back to suspended mid-game.
   */
  _wake() {
    if (this.ctx.state === "suspended") {
      this.ctx.resume().catch(() => {});
    }
  }

  /** Play a white-noise burst through an optional lowpass filter. */
  _noiseBurst({ duration = 0.3, peak = 0.5, cutoff = 4000, q = 0.7 } = {}) {
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer;
    const filt = this.ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.value = cutoff;
    filt.Q.value = q;
    const g = this._chain(src);
    g.connect(filt);
    // Re-route: source -> filter -> gain -> master
    src.disconnect();
    src.connect(filt);
    filt.connect(g);

    const t0 = this.ctx.currentTime;
    this._env(g, t0, peak, 0.005, duration);
    src.start(t0);
    src.stop(t0 + duration + 0.05);
  }

  /* -- public SFX methods -------------------------------------------------- */

  /**
   * Player laser fire: a short, low, punchy burst. Low-frequency sawtooth
   * with a fast pitch drop plus a tiny noise "crack" for bite — reads as a
   * heavy blaster shot without the piercing high end that fatigues the ear.
   */
  shoot() {
    this._wake();
    const t0 = this.ctx.currentTime;
    // Low saw body with a quick downward sweep (punchy, not shrill).
    const osc = this.ctx.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(320, t0);
    osc.frequency.exponentialRampToValueAtTime(70, t0 + 0.11);
    const filt = this.ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.value = 900;
    const g = this._chain(osc);
    osc.connect(filt);
    filt.connect(g);
    this._env(g, t0, 0.1, 0.004, 0.11);
    osc.start(t0);
    osc.stop(t0 + 0.15);
    // Short bright noise crack layered on top for attack/bite.
    this._noiseBurst({ duration: 0.05, peak: 0.06, cutoff: 2200, q: 0.9 });
  }

  /**
   * Explosion: filtered noise burst + a low sine thump.
   * `size` (default 1) scales both loudness and duration so small enemy
   * pops differ audibly from big boss blasts.
   */
  explode(size = 1) {
    this._wake();
    size = Math.max(0.25, Math.min(size, 3)); // clamp for sanity
    const dur = 0.25 + 0.25 * size;           // longer for bigger booms
    const vol = 0.35 * size;

    // Noise component, lowpassed so it reads as "boom" not "crackle".
    this._noiseBurst({
      duration: dur,
      peak: vol,
      cutoff: 1200 + 800 * size,
      q: 0.8,
    });

    // Low sine thump that gives the explosion its weight.
    const t0 = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(160, t0);
    osc.frequency.exponentialRampToValueAtTime(40, t0 + dur);
    const g = this._chain(osc);
    this._env(g, t0, vol, 0.01, dur);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  /**
   * Small crisp "pop" — a single enemy taking a hit. A very short bright
   * noise click plus a quick high blip gives that snappy arcade burst without
   * the low thump of a full explosion. Kept brief so rapid fire stays clean.
   */
  pop() {
    this._wake();
    const t0 = this.ctx.currentTime;
    // Bright, very short noise crackle (the "crack").
    this._noiseBurst({ duration: 0.08, peak: 0.32, cutoff: 6000, q: 0.7 });
    // Tiny descending square blip for body.
    const osc = this.ctx.createOscillator();
    osc.type = "square";
    osc.frequency.setValueAtTime(660, t0);
    osc.frequency.exponentialRampToValueAtTime(180, t0 + 0.09);
    const g = this._chain(osc);
    this._env(g, t0, 0.2, 0.004, 0.09);
    osc.start(t0);
    osc.stop(t0 + 0.13);
  }

  /**
   * Big chunky NES-style explosion — boss death. Layers a loud, long bright
   * noise crackle with a deep sub-bass boom and a few staggered "detonation"
   * cracks so it reads as a heavy multi-hit blast rather than one muffled thud.
   */
  bigBoom() {
    this._wake();
    const t0 = this.ctx.currentTime;
    // One long, loud bright crackle for the "brick/boom" body.
    this._noiseBurst({ duration: 0.9, peak: 0.75, cutoff: 4500, q: 0.8 });
    // Deep sub-bass boom for weight, slow roll-off so it lingers.
    const boom = this.ctx.createOscillator();
    boom.type = "sine";
    boom.frequency.setValueAtTime(150, t0);
    boom.frequency.exponentialRampToValueAtTime(25, t0 + 0.8);
    const bg = this._chain(boom);
    this._env(bg, t0, 0.7, 0.01, 0.8);
    boom.start(t0);
    boom.stop(t0 + 0.85);
  }

  /**
   * Scaled explosion used by the boss death sequence. `size` (0..1) drives
   * loudness, duration, noise brightness and sub-bass depth so a series of
   * calls can build from small cracks into a huge final detonation. Kept to
   * one noise burst + one oscillator per call (low node count) so rapid
   * bursts never exhaust the AudioContext's node budget.
   */
  boom(size = 1) {
    this._wake();
    size = Math.max(0.1, Math.min(size, 1));
    const vol = 0.4 + 0.6 * size;             // louder as it grows
    const t0 = this.ctx.currentTime;

    // Play the pre-rendered explosion (noise + decay baked in). Bigger booms
    // start earlier into the buffer's tail and run longer.
    const src = this.ctx.createBufferSource();
    src.buffer = this.explosionBuffer;
    src.playbackRate.value = 1.2 - 0.5 * size; // bigger = slower, deeper
    const g = this._chain(src);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
    src.start(t0);
    src.stop(t0 + 1.0);

    // Sub-bass sine thump for extra weight on the low end.
    const osc = this.ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(80 + 60 * size, t0);
    osc.frequency.exponentialRampToValueAtTime(35, t0 + 0.5);
    const og = this._chain(osc);
    this._env(og, t0, vol * 0.7, 0.008, 0.5);
    osc.start(t0);
    osc.stop(t0 + 0.55);
  }

  /** Descending sawtooth sweep — an enemy breaking formation to dive. */
  enemyDive() {
    this._wake();
    const t0 = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(1200, t0);
    osc.frequency.exponentialRampToValueAtTime(150, t0 + 0.5);
    // Light lowpass keeps the saw from being too harsh.
    const filt = this.ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.value = 3000;
    const g = this._chain(osc);
    osc.connect(filt);
    filt.connect(g);
    this._env(g, t0, 0.22, 0.02, 0.5);
    osc.start(t0);
    osc.stop(t0 + 0.55);
  }

  /** Ascending 4-note arpeggio — power-up collected. */
  powerUp() {
    this._wake();
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    const step = 0.09;                              // seconds between notes
    const t0 = this.ctx.currentTime;
    notes.forEach((freq, i) => {
      const t = t0 + i * step;
      const osc = this.ctx.createOscillator();
      osc.type = "triangle";                        // warm, pleasant timbre
      osc.frequency.value = freq;
      const g = this._chain(osc);
      this._env(g, t, 0.3, 0.01, 0.18);
      osc.start(t);
      osc.stop(t + 0.22);
    });
  }

  /**
   * Dramatic chord hit — wave intro. Several oscillators struck together
   * with slightly different waveforms for a rich, percussive stab.
   */
  waveIntro() {
    this._wake();
    const t0 = this.ctx.currentTime;
    // A minor-ish power chord with a fifth and octave for drama.
    const voices = [
      { type: "sawtooth", freq: 110.00, peak: 0.18 }, // A2
      { type: "sawtooth", freq: 164.81, peak: 0.14 }, // E3
      { type: "square",   freq: 220.00, peak: 0.12 }, // A3
      { type: "sine",     freq: 440.00, peak: 0.10 }, // A4 sparkle
    ];
    // Shared lowpass so the stacked saws don't alias harshly.
    const filt = this.ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.setValueAtTime(6000, t0);
    filt.frequency.exponentialRampToValueAtTime(800, t0 + 0.8);
    filt.Q.value = 1.2;
    filt.connect(this.master);

    voices.forEach((v) => {
      const osc = this.ctx.createOscillator();
      osc.type = v.type;
      osc.frequency.value = v.freq;
      const g = this.ctx.createGain();
      osc.connect(g);
      g.connect(filt);
      this._env(g, t0, v.peak, 0.01, 0.8);
      osc.start(t0);
      osc.stop(t0 + 0.85);
    });
  }

  /** Long descending tone — game over. */
  gameOver() {
    this._wake();
    const t0 = this.ctx.currentTime;
    const dur = 1.6;
    const osc = this.ctx.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(440, t0);
    osc.frequency.exponentialRampToValueAtTime(55, t0 + dur);
    const filt = this.ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.value = 2000;
    const g = this._chain(osc);
    osc.connect(filt);
    filt.connect(g);
    this._env(g, t0, 0.3, 0.05, dur);
    osc.start(t0);
    osc.stop(t0 + dur + 0.1);
  }
}

/* ---------------------------------------------------------------------------
 * MusicSequencer  (4-track synth engine, progressive)
 * -------------------------------------------------------------------------
 * A looping background-music sequencer built on top of the SfxEngine's shared
 * AudioContext + master gain (so the M-key mute silences music too).
 *
 * PROGRESSION: each track stores a bank of lead phrases and pad phrases (each
 * phrase = one 32-step / 2-bar block). Using each track's per-phrase length table (in bars) the sequencer
 * advances to the next phrase in the bank (wrapping), so the melody keeps
 * developing instead of repeating the same two bars forever. Bass and drums
 * stay on their steady groove.
 *
 * Four full tracks:
 *   0  punk      — 80s punk rock, driving E-root chug          (boss fights)
 *   1  metal     — E-minor power-chord metal                   (wave 1)
 *   2  synthwave — dark retro-horror arps + gated drums        (wave 2)
 *   3  acidjazz  — laid-back syncopated groove                 (wave 3)
 * ------------------------------------------------------------------------- */

// ---- note helpers ----------------------------------------------------------
const _NOTE = {
  C1:32.70,D1:36.71,E1:41.20,F1:43.65,G1:49.00,A1:55.00,B1:61.74,
  C2:65.41,D2:73.42,E2:82.41,F2:87.31,G2:98.00,A2:110.00,B2:123.47,
  C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196.00,A3:220.00,B3:246.94,
  C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,
  C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880.00,B5:987.77,
};
const R = null; // rest

class MusicSequencer {
  constructor(sfx) {
    this.sfx = sfx;
    this.ctx = sfx.ctx;
    this.master = sfx.master;
    this.noiseBuffer = sfx.noiseBuffer;

    this.tracks = [this._punk(), this._metal(), this._synthwave(), this._acidjazz()];

    this.playing = false;
    this.current = 0;         // active track index
    this.stepIndex = 0;       // next 16th-note to schedule
    this.barCount = 0;        // total 2-bar blocks played (drives phrase progression)
    this.nextNoteTime = 0;    // audio-clock time of next step
    this.timerId = null;
    this._liveOscs = new Set();

    this.lookahead = 0.12;
    this.tickMs = 25;
  }

  /* -- public API ---------------------------------------------------------- */

  /** Map wave number (>=1) to a track index (1..3) for normal play.
   *   wave 1 -> track 1 (metal), wave 2 -> track 2 (synthwave),
   *   wave 3 -> track 3 (acid jazz), then cycles. Boss -> track 0 (punk). */
  static intensityForWave(wave) {
    const w = Math.max(1, wave);
    return ((w - 1) % 3) + 1;  // 1, 2, 3, 1, 2, 3, ...
  }

  start(trackIndex) {
    trackIndex = (trackIndex == null) ? this.current : trackIndex;
    this.stop();
    this.current = Math.max(0, Math.min(this.tracks.length - 1, trackIndex | 0));
    this.playing = true;
    this.stepIndex = 0;
    this.barCount = 0;
    this.phraseCount = 0;   // total phrase-events played (drives drum level)
    this.nextNoteTime = this.ctx.currentTime + 0.06;

    this._busFilter = this.ctx.createBiquadFilter();
    this._busFilter.type = "lowpass";
    this._busFilter.frequency.value = 12000;
    this._busFilter.Q.value = 0.6;
    this._busGain = this.ctx.createGain();
    this._busGain.gain.value = 0.5;
    this._busFilter.connect(this._busGain);
    this._busGain.connect(this.master);

    this.timerId = setInterval(() => this._schedule(), this.tickMs);
  }

  stop() {
    if (this.timerId !== null) { clearInterval(this.timerId); this.timerId = null; }
    this.playing = false;
    const t = this.ctx.currentTime;
    this._liveOscs.forEach((n) => { try { n.stop(t + 0.02); } catch (e) {} });
    this._liveOscs.clear();
    if (this._busFilter) { try { this._busFilter.disconnect(); } catch (e) {} this._busFilter = null; }
    if (this._busGain)   { try { this._busGain.disconnect(); } catch (e) {} this._busGain = null; }
  }

  setTrack(i) {
    i = Math.max(0, Math.min(this.tracks.length - 1, i | 0));
    this.current = i;
    if (this.playing) {
      this.stepIndex = 0;
      this.barCount = 0;
      this.phraseCount = 0;
      this.nextNoteTime = this.ctx.currentTime + 0.04;
    }
  }

  setIntensity(_n) { /* deferred */ }

  _rearm() {
    if (!this.playing) return;
    this.nextNoteTime = this.ctx.currentTime + 0.05;
  }

  /* -- internal ------------------------------------------------------------ */

  _schedule() {
    const trk = this.tracks[this.current];
    while (this.nextNoteTime < this.ctx.currentTime + this.lookahead) {
      this._playStep(trk, this.stepIndex, this.nextNoteTime);
      const spb = 60.0 / trk.bpm;
      this.nextNoteTime += spb / 4;              // one 16th note
      this.stepIndex = (this.stepIndex + 1) % trk.steps;
      if (this.stepIndex === 0) { this.barCount++; this.phraseCount++; } // finished a 2-bar block (= one phrase)
    }
  }

  /**
   * Map the current bar-block count to a phrase index using each track's
   * per-phrase length table (in bars). e.g. lengths [2,2,1,1] means:
   *   phrase0 for 2 blocks, phrase1 for 2 blocks, phrase2 for 1, phrase3 for 1,
   * then the whole cycle repeats. This gives a build-up feel (long phrases
   * first, quick hits last) instead of a flat round-robin.
   */
  _phraseIndex(trk) {
    const lens = trk.phraseLens || trk.leads.map(() => 1);
    const total = lens.reduce((a, b) => a + b, 0);
    let pos = this.barCount % total;
    for (let i = 0; i < lens.length; i++) {
      if (pos < lens[i]) return i;
      pos -= lens[i];
    }
    return 0;
  }

  /**
   * Drum/arrangement intensity level, locked to the current phrase:
   *   phrase 0 -> level 0 (no drums)
   *   phrase 1 -> level 1 (light)
   *   phrase 2 -> level 2 (medium)
   *   phrase 3 -> level 3 (full)
   * Real-music logic: the big drum hit lands on the climax phrase every time,
   * while the accumulating lead layers (see _leadLayer) keep each pass fresh.
   */
  _drumLevel(trk) {
    return this._phraseIndex(trk);
  }

  _playStep(trk, step, t) {
    const pi = this._phraseIndex(trk);
    const lvl = this._drumLevel(trk);
    const leadPhrase = trk.leads[pi];
    const padPhrase  = trk.pads[pi];
    // Phrase-count-driven drums: light -> medium -> full (drifts across phrases).
    const drumSet = (trk.drums[lvl] != null) ? trk.drums[lvl] : trk.drums;
    const d = drumSet[step];
    if (d.k) this._kick(t, trk);
    if (d.s) this._snare(t, trk);
    if (d.h) this._hat(t, trk);
    const b = trk.bass[step];
    if (b) this._bass(t, b, trk);
    if (padPhrase && padPhrase[step]) this._pad(t, padPhrase[step], trk);
    const l = leadPhrase[step];
    if (l) this._lead(t, l, trk);
    // Extra lead layer builds with the same level (absent at level 0).
    if (trk.leadLayers && trk.leadLayers[lvl] && trk.leadLayers[lvl][pi]) {
      const xl = trk.leadLayers[lvl][pi][step];
      if (xl) this._leadLayer(t, xl, trk, lvl);
    }
  }

  /* -- voices -------------------------------------------------------------- */

  _kick(t, trk) {
    const osc = this.ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(trk.kickTop || 140, t);
    osc.frequency.exponentialRampToValueAtTime(trk.kickBot || 45, t + 0.12);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.9, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    osc.connect(g); g.connect(this._busFilter);
    osc.start(t); osc.stop(t + 0.18);
    this._track(osc, t + 0.2);
  }

  _snare(t, trk) {
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer;
    const hp = this.ctx.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 1400;
    const bp = this.ctx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 2200; bp.Q.value = 0.8;
    const g = this.ctx.createGain();
    const dur = 0.14;
    g.gain.setValueAtTime(0.0001, t);

    src.buffer = this.noiseBuffer;
    const hp = this.ctx.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 7000;
    const g = this.ctx.createGain();

  _bass(t, freq, trk) {
    const osc = this.ctx.createOscillator();
    osc.type = trk.bassType || "sawtooth";
    osc.frequency.setValueAtTime(freq, t);
    const lp = this.ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(trk.bassCut || 900, t);
    lp.Q.value = 1.2;
    const g = this.ctx.createGain();
    const dur = (trk.bassDur || 0.18);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.4, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    this._track(osc, t + dur + 0.05);

  _pad(t, freqs, trk) {
    const dur = (trk.padDur || 0.6);
    for (let i = 0; i < freqs.length; i++) {
      const osc = this.ctx.createOscillator();
      osc.type = trk.padType || "sawtooth";
      osc.frequency.setValueAtTime(freqs[i], t);
      osc.detune.value = (i === 0 ? -6 : i === 1 ? 6 : 0);
      const lp = this.ctx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = trk.padCut || 1600;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.09, t + 0.05);
      g.gain.setValueAtTime(0.09, t + dur - 0.08);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(lp); lp.connect(g); g.connect(this._busFilter);
      osc.start(t); osc.stop(t + dur + 0.02);
      this._track(osc, t + dur + 0.05);
    }
  }

  _lead(t, freq, trk) {
    const osc = this.ctx.createOscillator();
    osc.type = trk.leadType || "square";
    osc.frequency.setValueAtTime(freq, t);
    const lfo = this.ctx.createOscillator();
    lfo.type = "sine"; lfo.frequency.value = 5.5;
    const lfoGain = this.ctx.createGain();
    lfoGain.gain.value = trk.vib || 8;
    lfo.connect(lfoGain); lfoGain.connect(osc.detune);
    const lp = this.ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = trk.leadCut || 4000;
    const g = this.ctx.createGain();
    const dur = (trk.leadDur || 0.2);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.24, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(lp); lp.connect(g); g.connect(this._busFilter);
    osc.start(t); osc.stop(t + dur + 0.02);
    lfo.start(t); lfo.stop(t + dur + 0.02);
    this._track(osc, t + dur + 0.05);
    this._track(lfo, t + dur + 0.05);
  }

  /** Softer harmony/counter line that layers over the main lead on later cycles. */
  _leadLayer(t, freq, trk, cyc) {
    const osc = this.ctx.createOscillator();
    osc.type = trk.layerType || "triangle";
    osc.frequency.setValueAtTime(freq, t);
    const lp = this.ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = (trk.layerCut || 3000);
    const g = this.ctx.createGain();
    // Quieter than the main lead so it sits underneath; slightly louder each cycle.
    const peak = 0.12 + cyc * 0.04;
    const dur = (trk.layerDur || 0.24);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(lp); lp.connect(g); g.connect(this._busFilter);
    osc.start(t); osc.stop(t + dur + 0.02);
    this._track(osc, t + dur + 0.05);
  }

  _track(node, doneAt) {
    this._liveOscs.add(node);
    setTimeout(() => { this._liveOscs.delete(node); }, (doneAt - this.ctx.currentTime) * 1000 + 50);
  }

/* ---------------------------------------------------------------------------
 * Input handler
 * -------------------------------------------------------------------------
 * Tracks currently-held keys in a Set. Keydown fires once per press
 * (auto-repeat ignored via e.repeat) which is what we want for actions like
 * shooting; held movement reads from the Set each frame.
 * ------------------------------------------------------------------------- */
const Input = {
  keys: new Set(),
  init() {
    window.addEventListener("keydown", (e) => {
      // First interaction unlocks audio (browser autoplay policy).
      ensureAudio();

      // Space / arrows prevent page scroll.
      if (e.code === "Space" || e.code.startsWith("Arrow")) e.preventDefault();

      // --- State transitions (fire once per press, ignore auto-repeat) -----
      if (!e.repeat) {
        const s = Game.state;
        // ENTER: start from title, restart from game-over.
        if (e.code === "Enter") {
          if (s === "title" || s === "gameOver") Game.startGame();
        }
        // P: pause / resume during active play; jukebox preview on the title.
        if (e.code === "KeyP") {
          if (s === "title") {
            // Jukebox: first P starts on song 1 (track 0); each next P advances.
            if (music) {
              const started = music.playing;
              const next = started ? (music.current + 1) % music.tracks.length : 0;
              music.start(next);
              Game.jukeboxLabel = "#" + (next + 1) + "  " + music.tracks[next].name;
              console.log("[jukebox] P -> #" + (next + 1), music.tracks[next].name);
            }
          } else if (s === "playing" || s === "bossFight") Game.pause();
          else if (s === "paused") Game.resume();
        }
        // M: mute / unmute across every state.
        if (e.code === "KeyM" && sfx) {
          sfx.setMute(!sfx.muted);
        }
        // F: play a quick SFX preview (like P for music). Works on any state so
        // you can audition sounds without starting a game.
        if (e.code === "KeyF" && sfx) {
          Game._previewSfx();
        }
      }

      Input.keys.add(e.code);
    });
    window.addEventListener("keyup", (e) => {
      Input.keys.delete(e.code);
    });
  },
  down(code) { return Input.keys.has(code); },
};

/* ---------------------------------------------------------------------------
 * Audio bootstrap
 * -------------------------------------------------------------------------
 * Browsers block AudioContext until a user gesture. We create the context and
 * SfxEngine lazily on the first keydown or click, then resume it if suspended.
 * ------------------------------------------------------------------------- */
let sfx = null;
let music = null;

function ensureAudio() {
  if (sfx) {
    // Context may still be suspended (autoplay policy). Resume it and, once
    // running, re-arm any active music loop so its lookahead clock is correct.
    if (sfx.ctx.state === "suspended") {
      sfx.ctx.resume().then(() => {
        if (music && music.playing) music._rearm();
      }).catch(() => {});
    }
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  sfx = new SfxEngine(ctx);
  // Create the background-music sequencer on the same context/master gain so
  // the M-key mute (which ramps sfx.master to 0) silences music as well.
  music = new MusicSequencer(sfx);
  if (ctx.state === "suspended") ctx.resume();
}

// Click anywhere on the canvas also unlocks audio (useful for touch/click).
document.getElementById("game").addEventListener("click", ensureAudio);
// Pointer-down fires earlier than click and covers touch; unlock on any press.
window.addEventListener("pointerdown", ensureAudio);
/* ---------------------------------------------------------------------------
 * PNG Sprite System
 * -------------------------------------------------------------------------
 * Loads AI-generated sprite sheets from ../assets/abyss-qwen/ and provides
 * drawSprite() / drawPngSprite() for rendering animated frames.
 * ==========================================================================*/
const PNG_SPRITES = {};   // name -> { frames: [...], w, h, scaleW }
let pngLoadCount = 0;
let pngTotal = 0;

/** Register a PNG sprite set and preload all its frames. */
function loadPngSprite(name, dir, prefix, frameCount, scaleW) {
  const def = { frames: [], w: 0, h: 0, scaleW: scaleW || 48 };
  PNG_SPRITES[name] = def;
  for (let i = 1; i <= frameCount; i++) {
    pngTotal++;
    const img = new Image();
    img.onload = () => {
      if (!def.w) { def.w = img.naturalWidth; def.h = img.naturalHeight; }
      pngLoadCount++;
    };
    img.onerror = () => { pngLoadCount++; };
    const base = new URL("../", document.baseURI).href.replace(/[^/]*$/, "");
    img.src = `${base}assets/abyss-qwen/${dir}/${prefix}_f${i}.png`;
    def.frames.push(img);
  }
}

/**
 * Draw a PNG sprite centered on (cx, cy), scaled so its width matches `scaleW`.
 * Returns true if drawn, false if the image isn't ready yet.
 */
function drawPngSprite(ctx, name, frame, cx, cy) {
  const def = PNG_SPRITES[name];
  if (!def || !def.frames.length || !def.frames[0].complete) return false;
  const img = def.frames[Math.max(0, Math.min(frame | 0, def.frames.length - 1))];
  if (!img.complete || !img.naturalWidth) return false;
  const dw = def.scaleW;
  const dh = Math.round(dw * (def.h / def.w));
  ctx.drawImage(img, Math.round(cx - dw / 2), Math.round(cy - dh / 2), dw, dh);
  return true;
}

/**
 * Render a named sprite at the given frame/position.
 * Uses the PNG asset when available; no-op otherwise.
 */
function drawSprite(ctx, name, frame, x, y, scale = 1) {
  const pngDef = PNG_SPRITES[name];
  if (pngDef && pngDef.frames.length && pngDef.frames[0].complete) {
    drawPngSprite(ctx, name, frame, x + (pngDef.scaleW || 48) / 2, y + (pngDef.scaleW || 48) / 2);
  }
}

/* ---------------------------------------------------------------------------
 * Background
 * -------------------------------------------------------------------------
 * A single wide underwater image (assets/abyss-qwen/background.png) drawn scaled to
 * cover the canvas height, then panned horizontally. It drifts very slowly in
 * one direction and reverses at the image's edge (ping-pong), so the scene
 * gently sways side to side forever. Replaces the old procedural starfield as
 * the visual backdrop; stars are kept only as a faint twinkle overlay.
 * ------------------------------------------------------------------------- */
class Background {
  constructor(width, height) {
    this.w = width;
    this.h = height;
    this.img = new Image();
    const base = new URL("../", document.baseURI).href.replace(/[^/]*$/, "");
    this.img.src = `${base}assets/abyss-qwen/background.png`;
    this.loaded = false;
    this.img.onload = () => { this.loaded = true; };
    // Pan state: offset in source-image pixels, moving left (negative dir).
    this.speed = 8;        // px/s of horizontal drift (very slow)
    this.dir = -1;         // -1 = scrolling left, +1 = scrolling right
    this.offset = 0;       // current x position of the image's left edge
    // Faint star twinkle overlay for a bit of life on top of the art.
    this.stars = [];
    for (let i = 0; i < 40; i++) {
      this.stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        tw: Math.random() * Math.PI * 2,
      });
    }
  }

  /** How many source-pixels wide the image renders at (covering canvas height). */
  _drawW() { return this.img.naturalWidth * (this.h / this.img.naturalHeight); }
  _drawH() { return this.h; }

  update(dt) {
    if (!this.loaded) return;
    const dw = this._drawW();
    // The image's left edge can range from (w - dw) [fully right] up to 0 [left].
    const minOff = this.w - dw;   // negative when image is wider than canvas
    const maxOff = 0;
    this.offset += this.dir * this.speed * dt;
    // Ping-pong at the bounds.
    if (this.offset <= minOff) { this.offset = minOff; this.dir = 1; }
    else if (this.offset >= maxOff) { this.offset = maxOff; this.dir = -1; }
    for (const s of this.stars) s.tw += dt * 3;
  }

  render(ctx) {
    // Base fill so there's never a flash of white before the image loads.
    ctx.fillStyle = "#000010";
    ctx.fillRect(0, 0, this.w, this.h);

    if (this.loaded) {
      const dw = this._drawW();
      const dh = this._drawH();
      ctx.drawImage(this.img, Math.round(this.offset), 0, Math.round(dw), dh);
    }

    // Faint twinkling specks over the art for subtle motion.
    for (const s of this.stars) {
      const a = 0.15 + 0.2 * (0.5 + 0.5 * Math.sin(s.tw));
      ctx.globalAlpha = a;
      ctx.fillStyle = "#bff";
      ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, 1);
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------------------------------------------------------------------------
 * Starfield
 * -------------------------------------------------------------------------
 * Three parallax layers (far / mid / near), each with its own speed, density,
 * and star size. Stars scroll downward and wrap around when they leave the
 * screen. Different layer speeds create depth.
 * ------------------------------------------------------------------------- */
class Starfield {
  constructor(width, height) {
    this.w = width;
    this.h = height;
    // Layers from far (slowest, smallest, dimmest) to near (fastest, biggest).
    this.layers = [
      { speed: 20,  density: 60, size: 1, stars: [] }, // far
      { speed: 55,  density: 35, size: 2, stars: [] }, // mid
      { speed: 120, density: 18, size: 3, stars: [] }, // near
    ];
    this._init();
  }

  _init() {
    for (const layer of this.layers) {
      layer.stars = [];
      for (let i = 0; i < layer.density; i++) {
        layer.stars.push({
          x: Math.random() * this.w,
          y: Math.random() * this.h,
          twinkle: Math.random() * Math.PI * 2,
        });
      }
    }
  }

  /** Scroll all layers downward by dt seconds; wrap stars that exit. */
  update(dt) {
    for (const layer of this.layers) {
      for (const s of layer.stars) {
        s.y += layer.speed * dt;
        s.twinkle += dt * 3;
        if (s.y > this.h) {
          s.y -= this.h;
          s.x = Math.random() * this.w;
        }
      }
    }
  }

  /** Draw all star layers (call first, as the background). */
  render(ctx) {
    const brightness = [0.35, 0.6, 1.0]; // far dimmest, near brightest
    for (let li = 0; li < this.layers.length; li++) {
      const layer = this.layers[li];
      const baseAlpha = brightness[li];
      const sz = layer.size;
      for (const s of layer.stars) {
        // Subtle twinkle modulates alpha per-star.
        const a = baseAlpha * (0.7 + 0.3 * Math.sin(s.twinkle));
        ctx.globalAlpha = a;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(Math.round(s.x), Math.round(s.y), sz, sz);
      }
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------------------------------------------------------------------------
 * ParticleSystem (Task 2.2)
 * -------------------------------------------------------------------------
 * A lightweight, allocation-light particle pool for explosions and bursts.
 * Each particle: { x, y, vx, vy, life, maxLife, color, size }.
 *   - explode(x, y, color, count) spawns `count` particles radiating outward
 *     with random speed/angle; gravity is applied over time in update();
 *     alpha fades as life/maxLife -> 0.
 *   - update(dt) advances positions, applies gravity, decrements life, culls.
 *   - render(ctx) draws each surviving particle with alpha = life/maxLife.
 * ------------------------------------------------------------------------- */
class ParticleSystem {
  constructor() {
    this.particles = [];
    // Downward pull so debris arcs and falls; tuned to feel "weighty".
    this.gravity = 380;
    // Soft cap so a screen full of simultaneous deaths stays performant.
    this.maxParticles = 900;
  }

  /**
   * Spawn an explosion at (x, y).
   * @param {number} x       center x
   * @param {number} y       center y
   * @param {string} color   base CSS color (brightened per-particle)
   * @param {number} count   number of particles (default 24)
   */
  explode(x, y, color = "#ffe23e", count = 24) {
    const room = Math.min(count, this.maxParticles - this.particles.length);
    if (room <= 0) return;
    for (let i = 0; i < room; i++) {
      const angle = Math.random() * Math.PI * 2;
      // Speed spread: mostly mid-fast, a few slow embers and a few fast sparks.
      const speed = 60 + Math.random() * 320;
      const maxLife = 0.35 + Math.random() * 0.55; // 0.35s .. 0.9s
      this.particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 40, // slight upward bias reads better
        life: maxLife,
        maxLife,
        color: this._shade(color, Math.random() * 0.6), // brighten some
        size: 1 + Math.random() * 3,
      });
    }
  }

  /** Advance every particle by dt seconds; apply gravity; cull the dead. */
  update(dt) {
    const g = this.gravity;
    const ps = this.particles;
    for (let i = ps.length - 1; i >= 0; i--) {
      const p = ps[i];
      p.life -= dt;
      if (p.life <= 0) {
        // Swap-remove: O(1) cull without shifting the whole array.
        ps[i] = ps[ps.length - 1];
        ps.pop();
        continue;
      }
      p.vy += g * dt;          // gravity pulls down
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      // Mild air drag so fast sparks decelerate naturally.
      p.vx *= (1 - 0.9 * dt);
    }
  }

  /** Draw all surviving particles; alpha tracks remaining life fraction. */
  render(ctx) {
    for (const p of this.particles) {
      const a = Math.max(0, Math.min(1, p.life / p.maxLife));
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      const s = Math.max(1, p.size * (0.4 + 0.6 * a)); // shrink as it dies
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
  }

  /**
   * Lighten a hex color toward white by factor f (0..1). Returns a CSS color.
   * Used to give each explosion a mix of base-color and hot-white sparks.
   */
  _shade(hex, f) {
    if (!/^#([0-9a-f]{6})$/i.test(hex)) return hex;
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.round(r + (255 - r) * f);
    g = Math.round(g + (255 - g) * f);
    b = Math.round(b + (255 - b) * f);
    return "#" + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  }
}

/* ---------------------------------------------------------------------------
 * ScreenShake (Task 2.2)
 * -------------------------------------------------------------------------
 * A decaying camera offset. add(intensity) bumps the current shake level;
 * update(dt) decays it toward zero over ~300ms; render() wraps world drawing
 * in a random ctx.translate proportional to the current intensity and resets
 * the transform afterwards. On a player hit we call add(8) for ~8px shake.
 * ------------------------------------------------------------------------- */
class ScreenShake {
  constructor() {
    this.intensity = 0;      // current shake magnitude (pixels)
    this.decayMs = 300;      // how long a single impulse takes to fade
    this._offsetX = 0;
    this._offsetY = 0;
  }

  /** Raise the shake level (clamped to a sane max). */
  add(amount) {
    this.intensity = Math.min(24, this.intensity + amount);
  }

  /** Decay the shake toward zero over ~decayMs. */
  update(dt) {
    if (this.intensity > 0) {
      // Exponential-ish decay scaled so it reaches ~0 in about decayMs.
      const k = dt * 1000 / this.decayMs;
      this.intensity *= Math.pow(0.001, k); // ~1/1000 per decay window
      if (this.intensity < 0.05) this.intensity = 0;
      // Recompute a fresh random offset each frame (jitter).
      this._offsetX = (Math.random() * 2 - 1) * this.intensity;
      this._offsetY = (Math.random() * 2 - 1) * this.intensity;
    } else {
      this._offsetX = 0;
      this._offsetY = 0;
    }
  }

  /**
   * Apply the shake translate to ctx, draw the world via `drawWorld`, then
   * restore the transform. Keeps the caller's context state clean.
   */
  render(ctx, drawWorld) {
    if (this.intensity > 0) {
      ctx.save();
      ctx.translate(this._offsetX, this._offsetY);
      drawWorld();
      ctx.restore();
    } else {
      drawWorld();
    }
  }
}

/* ---------------------------------------------------------------------------
 * MuzzleFlash (Task 2.2)
 * -------------------------------------------------------------------------
 * A brief bright burst drawn at the player cannon tip when they fire. We track
 * a short timer (~50ms); while active, render() paints a yellow/white glow at
 * the ship's nose. Triggered from the shoot handler.
 * ------------------------------------------------------------------------- */
class MuzzleFlash {
  constructor() {
    this.timer = 0;         // seconds remaining
    this.duration = 0.05;   // ~50ms flash
    this.x = 0;
    this.y = 0;
  }

  /** Start a flash centered on (x, y). */
  trigger(x, y) {
    this.timer = this.duration;
    this.x = x;
    this.y = y;
  }

  get active() { return this.timer > 0; }

  update(dt) {
    if (this.timer > 0) this.timer -= dt;
  }

  /** Draw a radial yellow->white burst at the stored position. */
  render(ctx) {
    if (!this.active) return;
    const t = this.timer / this.duration; // 1 -> 0
    const r = 6 + 10 * t;                 // grows as it fades out
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
    grad.addColorStop(0, `rgba(255,255,255,${t})`);
    grad.addColorStop(0.4, `rgba(255,240,120,${0.9 * t})`);
    grad.addColorStop(1, "rgba(255,180,40,0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ---------------------------------------------------------------------------
 * DamageVignette (CoD-style)
 * -------------------------------------------------------------------------
 * A red radial vignette that fades in from the screen edges when the player
 * takes damage, peaks, then fades out. Repeated hits re-trigger and stack a
 * little so sustained damage keeps the warning visible. Drawn last, over the
 * world but under state screens, so it never obscures the center of play.
 * ------------------------------------------------------------------------- */
class DamageVignette {
  constructor() {
    this.timer = 0;        // seconds remaining
    this.duration = 0.7;   // full fade-in/out window
    this.intensity = 0;    // 0..1 current strength (peaks at trigger value)
    this.peak = 0.85;      // how strong a single hit reads
  }

  /** Trigger (or re-trigger) the vignette. Stacks up to a max intensity. */
  trigger(strength = 0.85) {
    this.peak = Math.min(1, Math.max(this.intensity, strength));
    this.timer = this.duration;
  }

  get active() { return this.timer > 0 && this.intensity > 0.01; }

  update(dt) {
    if (this.timer <= 0) { this.intensity = 0; return; }
    this.timer -= dt;
    // Ease: quick rise to peak in first ~20%, then decay to zero.
    const t = Math.max(0, this.timer / this.duration); // 1 -> 0
    const attack = 0.2;                                 // fraction of window for the rise
    let env;
    if (t > 1 - attack) {
      // rising edge (just got hit): map [1-attack,1] -> [0,1]
      env = (1 - t) / attack;
    } else {
      // falling edge: smooth decay
      env = t / (1 - attack);
    }
    this.intensity = this.peak * Math.max(0, Math.min(1, env));
  }

  /** Draw a red radial gradient hugging the screen edges. */
  render(ctx) {
    if (!this.active) return;
    const a = this.intensity;
    const cx = W / 2, cy = H / 2;
    // Radius large enough that the inner (clear) zone covers the play area,
    // but the red reaches well past mid-screen so it's clearly visible.
    const r = Math.hypot(W, H) * 0.75;
    const grad = ctx.createRadialGradient(cx, cy, r * 0.30, cx, cy, r);
    grad.addColorStop(0, "rgba(200,0,0,0)");
    grad.addColorStop(0.55, `rgba(190,10,10,${0.45 * a})`);
    grad.addColorStop(0.85, `rgba(160,0,0,${0.75 * a})`);
    grad.addColorStop(1, `rgba(140,0,0,${0.95 * a})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---------------------------------------------------------------------------
 * DeathAnim (Task 2.2)
 * -------------------------------------------------------------------------
 * When an entity dies it flashes white briefly (~100ms) then bursts into
 * particles. We implement this as a small list of "dying" records that the
 * game updates each frame:
 *   - start(entity) marks it dying and schedules its burst.
 *   - update(dt) counts down the flash phase; when it ends it calls
 *     particleSystem.explode at the entity's position and removes the record.
 *   - render(ctx) paints a white flash rect over the entity during the phase.
 * The helper `killEntity(entity, opts)` wires everything together in one call.
 * ------------------------------------------------------------------------- */
class DeathAnim {
  constructor(particleSystem) {
    this.ps = particleSystem;
    this.dying = []; // { x, y, w, h, color, t, dur, exploded }
  }

  /**
   * Begin a death animation for an entity ({x,y,w,h,color}).
   * Returns the record so callers can remove the entity from their own lists.
   */
  start(entity, opts = {}) {
    const rec = {
      x: entity.x,
      y: entity.y,
      w: entity.w,
      h: entity.h,
      color: entity.color || "#ffffff",
      t: 0,
      dur: opts.flashTime ?? 0.1,   // ~100ms white flash
      exploded: false,
    };
    this.dying.push(rec);
    return rec;
  }

  /** One-shot convenience: mark dying, schedule burst, return the record. */
  killEntity(entity, opts = {}) {
    return this.start(entity, opts);
  }

  /** Count down each flash; fire the particle burst when the phase completes. */
  update(dt) {
    for (let i = this.dying.length - 1; i >= 0; i--) {
      const d = this.dying[i];
      d.t += dt;
      if (!d.exploded && d.t >= d.dur) {
        // Burst at the entity's center using its own color.
        this.ps.explode(d.x + d.w / 2, d.y + d.h / 2, d.color, 28);
        d.exploded = true;
      }
      // Remove once the flash has fully played (burst already fired).
      if (d.t >= d.dur) {
        this.dying.splice(i, 1);
      }
    }
  }

  /** Paint a white flash over each entity still in its flash phase. */
  render(ctx) {
    for (const d of this.dying) {
      const a = Math.max(0, 1 - d.t / d.dur); // 1 -> 0 across the flash
      ctx.globalAlpha = a;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(d.x, d.y, d.w, d.h);
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------------------------------------------------------------------------
 * Player (Task 3.1)
 * -------------------------------------------------------------------------
 * The real player ship: keyboard/touch movement, shooting with cooldown,
 * invincibility frames after a hit, and a lives counter. Replaces the old
 * placeholder rect that lived on the Game object.
 *
 *   - x, y, w, h        position + hitbox (top-left origin)
 *   - speed             horizontal (and vertical) movement in px/s
 *   - shootCooldown     seconds between shots
 *   - invincible        seconds of remaining invincibility (blinks while >0)
 *   - lives             remaining lives (game over at 0)
 *   - spread            hook for a future 'triple' power-up (3-way fire)
 *   - shieldTimer       hook for a future shield bubble (drawn when >0)
 * ------------------------------------------------------------------------- */
class Player {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.w = 40;            // hitbox width (sprite draws ~56px wide)
    this.h = 32;            // hitbox height
    this.speed = 280;          // px/s horizontal & vertical
    this.shootCooldown = 0;    // seconds until next shot allowed
    this.cooldownMax = 0.15;   // base cooldown duration
    this.invincible = 0;       // seconds of remaining invincibility
    this.lives = 3;
    this.spread = false;       // true -> 3-way spread shot (power-up hook)
    this.shieldTimer = 0;      // >0 -> draw a shield bubble around the ship
    // Vertical band: the ship may drift up/down only within this lower region.
    this.minY = H - 160;
    this.maxY = H - this.h;
  }

  /** Center-x helper (used for muzzle flash / bullet spawn). */
  get cx() { return this.x + this.w / 2; }
  /** Center-y helper (used by collision / VFX). */
  get cy() { return this.y + this.h / 2; }

  /**
   * Advance the ship by dt seconds using held input keys.
   * @param {number} dt      frame delta (seconds)
   * @param {object} input   an Input-like object exposing down(code)
   */
  update(dt, input) {
    // Horizontal movement (arrows / A-D).
    let dx = 0;
    if (input.down("ArrowLeft") || input.down("KeyA")) dx -= 1;
    if (input.down("ArrowRight") || input.down("KeyD")) dx += 1;
    this.x += dx * this.speed * dt;

    // Vertical movement (arrows / W-S), clamped to a bounded band near bottom.
    let dy = 0;
    if (input.down("ArrowUp") || input.down("KeyW")) dy -= 1;
    if (input.down("ArrowDown") || input.down("KeyS")) dy += 1;
    this.y += dy * this.speed * dt;

    // Clamp to canvas bounds (horizontal) and the vertical band.
    this.x = Math.max(0, Math.min(W - this.w, this.x));
    this.y = Math.max(this.minY, Math.min(this.maxY, this.y));

    // Decrement timers (floor at 0).
    if (this.shootCooldown > 0) this.shootCooldown -= dt;
    if (this.invincible > 0) this.invincible -= dt;
    if (this.shieldTimer > 0) this.shieldTimer -= dt;
  }

  /**
   * Fire a bullet if the cooldown has elapsed.
   * @returns {Array<object>} bullets spawned this call (empty if on cooldown)
   */
  shoot() {
    if (this.shootCooldown > 0) return [];
    this.shootCooldown = this.cooldownMax;

    const bx = this.cx;
    const by = this.y;           // spawn at the nose
    const speed = 720;           // upward px/s
    const out = [];

    if (this.spread) {
      // 3-way spread: center plus two angled side shots.
      const ang = 0.35;          // radians off-vertical
      out.push({ x: bx, y: by, vx: 0, vy: -speed, w: 3, h: 8 });
      out.push({ x: bx, y: by, vx: -Math.sin(ang) * speed, vy: -Math.cos(ang) * speed, w: 3, h: 8 });
      out.push({ x: bx, y: by, vx: Math.sin(ang) * speed, vy: -Math.cos(ang) * speed, w: 3, h: 8 });
    } else {
      out.push({ x: bx, y: by, vx: 0, vy: -speed, w: 3, h: 8 });
    }

    // Muzzle flash at the cannon tip + laser SFX.
    if (Game.muzzleFlash) Game.muzzleFlash.trigger(bx, by);
    if (sfx) sfx.shoot();
    return out;
  }

  /**
   * Register a hit on the ship.
   * @returns {boolean} true if the game is now over (no lives left)
   */
  hit() {
    if (this.invincible > 0) return false; // still protected from the last hit
    this.lives -= 1;
    this.invincible = 2; // 2 seconds of blinking invincibility

    // Screen shake (~8px) + explosion burst at the ship's position.
    if (Game.screenshake) Game.screenshake.add(14);
    if (Game.particleSystem) {
      Game.particleSystem.explode(this.cx, this.y + this.h / 2, "#3ef0ff", 40);
    }
    if (Game.damageVignette) Game.damageVignette.trigger(0.85);
    if (sfx) sfx.boom(0.7);
    return this.lives <= 0;
  }

  /** Draw the ship sprite; blink while invincible; show shield bubble if active. */
  render(ctx) {
    // Invincibility blink: toggle visibility every ~100ms.
    if (this.invincible > 0 && Math.floor(this.time ?? 0) % 2 === 0) {
      // Use a time-based blink so it reads as a steady flicker.
      const phase = Math.floor((performance.now() / 100)) % 2;
      if (phase === 0) return; // skip drawing this half-cycle (invisible)
    }

    const frame = Math.floor((this.time ?? 0) * 8) % 4; // manta ray wing cycle
    drawSprite(ctx, "player", frame, this.x, this.y, 1);

    // Shield bubble (future power-up hook): translucent ring while active.
    if (this.shieldTimer > 0) {
      ctx.save();
      ctx.globalAlpha = 0.5 + 0.3 * Math.sin((this.time ?? 0) * 12);
      ctx.strokeStyle = "#3ef0ff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.cx, this.y + this.h / 2, this.w * 0.9, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }
}

/* ---------------------------------------------------------------------------
 * Enemy (Task 3.2)
 * -------------------------------------------------------------------------
 * A single Galaga-style enemy with a four-state machine:
 *   entering  -> spiral/bezier path from off-screen top down to its slot
 *   idle      -> gentle sine bob around the slot; periodic dive decisions
 *   diving    -> chase the player on a weaving (sine-oscillating) descent,
 *                firing an enemy bullet occasionally while diving
 *   returning -> fly back up to its slot (or exit the screen if it has none)
 *
 * Fields:
 *   type       'bee' | 'butterfly' | 'fighter'
 *   state      one of the four states above
 *   points     bee=100, butterfly=200, fighter=400
 *   x,y,w,h    hitbox (top-left origin)
 *   slot       {x,y} home position in the formation grid
 * ------------------------------------------------------------------------- */

// Per-type tuning: sprite size, entry speed, dive speed, fire cadence.
const ENEMY_TYPES = {
  bee:       { w: 20, h: 16, points: 100, entrySpeed: 260, diveSpeed: 220, weaveAmp: 26, weaveFreq: 5,  fireEvery: 0.8 },
  butterfly: { w: 24, h: 20, points: 200, entrySpeed: 230, diveSpeed: 250, weaveAmp: 40, weaveFreq: 3.5, fireEvery: 0.65 },
  fighter:   { w: 28, h: 24, points: 400, entrySpeed: 200, diveSpeed: 300, weaveAmp: 54, weaveFreq: 2.5, fireEvery: 0.5 },
  // Extra tiers so all 6 aquatic enemies appear across waves.
  shooter:   { w: 22, h: 18, points: 150, entrySpeed: 245, diveSpeed: 235, weaveAmp: 32, weaveFreq: 4.2, fireEvery: 0.72 },
  brute:     { w: 26, h: 22, points: 300, entrySpeed: 215, diveSpeed: 270, weaveAmp: 46, weaveFreq: 3,   fireEvery: 0.58 },
  raider:    { w: 30, h: 26, points: 450, entrySpeed: 190, diveSpeed: 320, weaveAmp: 58, weaveFreq: 2.2, fireEvery: 0.48 },
};

/**
 * Creature roster for wave rotation, weakest -> strongest. Each maps to an
 * ENEMY_TYPES key (which carries its sprite + stats). Waves rotate through
 * this list so all 6 creatures get used over a 6-wave cycle.
 */
const CREATURES = [
  { type: "bee",       name: "jellyfish" },    // weakest
  { type: "butterfly", name: "pufferfish" },
  { type: "shooter",   name: "mantis_crab" },
  { type: "brute",     name: "anglerfish" },
  { type: "raider",    name: "mech_shark" },
  { type: "fighter",   name: "sea_dragon" },   // strongest
];

class Enemy {
  /**
   * @param {string} type   'bee' | 'butterfly' | 'fighter'
   * @param {{x:number,y:number}} slot  home position (center) in the grid
   */
  constructor(type, slot) {
    const t = ENEMY_TYPES[type];
    this.type = type;
    this.w = t.w;
    this.h = t.h;
    this.points = t.points;
    this.slot = { x: slot.x, y: slot.y };

    // Start off-screen at the top so the entry path spirals down into place.
    this.x = slot.x - this.w / 2;
    this.y = -this.h - Math.random() * 40;

    this.state = "entering";
    this.time = 0;          // per-enemy animation clock
    this.entryT = 0;        // progress along the entry path (0..1)
    this.entryDur = 1.4 + Math.random() * 0.6; // seconds to reach the slot
    this.bobPhase = Math.random() * Math.PI * 2;
    this.diveTimer = 0;     // countdown to next dive decision
    this.fireTimer = 0;     // countdown to next dive-shot
    this.idleFireTimer = 2 + Math.random() * 4; // countdown to next idle aimed shot
    this.weavePhase = 0;    // phase for the weaving dive path
    this.vx = 0;            // last-frame velocity (for render rotation)
    this.vy = 0;
    this.hasSlot = true;    // false once destroyed-without-replacement
    this.dead = false;
  }

  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }

  /** Begin a dive toward the player. Plays the dive SFX once. */
  _startDive(player) {
    this.state = "diving";
    this.weavePhase = 0;
    // Fire soon after the dive starts so the shot is visible mid-descent.
    this.fireTimer = 0.25 + Math.random() * 0.3;
    if (sfx) sfx.enemyDive();
  }

  /**
   * Advance the enemy by dt seconds.
   * @param {number} dt         frame delta (seconds)
   * @param {object} player     the Player instance (chase target)
   * @param {number} wave       current wave number (drives dive aggression)
   */
  update(dt, player, wave) {
    this.time += dt;
    let px = this.x, py = this.y;

    switch (this.state) {
      case "entering": {
        // Spiral/bezier-ish approach: ease progress, arc sideways then settle.
        this.entryT += dt / this.entryDur;
        const t = Math.min(1, this.entryT);
        // Ease-out so the enemy decelerates as it settles into the slot.
        const e = 1 - Math.pow(1 - t, 3);
        // Lateral swing that peaks mid-entry (a curved path, not a straight drop).
        const swing = Math.sin(t * Math.PI) * 60;
        const targetX = this.slot.x - this.w / 2 + swing * (1 - e);
        const startY = -this.h;
        const targetY = this.slot.y - this.h / 2;
        this.x = targetX;
        this.y = startY + (targetY - startY) * e;
        if (t >= 1) {
          this.state = "idle";
          this.diveTimer = 0.5 + Math.random() * 1.2;
        }
        break;
      }

      case "idle": {
        // Gentle bobbing around the slot.
        const bob = Math.sin(this.time * 2 + this.bobPhase) * 3;
        this.x = this.slot.x - this.w / 2;
        this.y = this.slot.y - this.h / 2 + bob;
        // Each enemy keeps its own randomized dive timer, so dives are
        // staggered across the formation (no synchronized mass-dive) while
        // still happening often enough to feel active. Aggression rises with
        // the wave number.
        this.diveTimer -= dt;
        if (this.diveTimer <= 0 && player) {
          const p = Math.min(0.55, 0.28 + wave * 0.06);
          if (Math.random() < p) this._startDive(player);
          // Randomized next-check window breaks up any synchronization.
          this.diveTimer = 2.4 + Math.random() * 3.6;
        }
        break;
      }

      case "diving": {
        // Weaving descent chasing the player: move downward, oscillate horizontally.
        const t = ENEMY_TYPES[this.type];
        this.weavePhase += dt * t.weaveFreq;
        const baseX = player ? player.cx : W / 2;
        const weave = Math.sin(this.weavePhase) * t.weaveAmp;
        const desiredX = baseX + weave - this.w / 2;
        // Steer toward the weaving target; keep falling.
        this.x += (desiredX - this.x) * Math.min(1, dt * 6);
        this.y += t.diveSpeed * dt;
        // Fire an enemy bullet occasionally while diving.
        this.fireTimer -= dt;
        if (this.fireTimer <= 0) {
          this._fireBullet();
          this.fireTimer = t.fireEvery * (1.3 + Math.random() * 1.0);
        }
        // Reached the bottom: instead of vanishing (which let waves clear
        // themselves), turn around and fly back to the formation slot. This
        // keeps the enemy alive so only a player shot can remove it.
        if (this.y > H - 40) {
          this.state = "returning";
        }
        break;
      }

      case "returning": {
        // Fly back up to the slot (straight line, eased).
        const dx = (this.slot.x - this.w / 2) - this.x;
        const dy = (this.slot.y - this.h / 2) - this.y;
        const dist = Math.hypot(dx, dy);
        const speed = 320;
        if (dist < 4) {
          this.x = this.slot.x - this.w / 2;
          this.y = this.slot.y - this.h / 2;
          this.state = "idle";
          this.diveTimer = 2 + Math.random() * 3;
        } else {
          this.x += (dx / dist) * speed * dt;
          this.y += (dy / dist) * speed * dt;
        }
        break;
      }
    }

    // Record velocity for render-time rotation.
    this.vx = (this.x - px) / Math.max(dt, 0.0001);
    this.vy = (this.y - py) / Math.max(dt, 0.0001);
  }

  /** Spawn an enemy bullet aimed roughly at the player (downward bias). */
  _fireBullet() {
    if (!Game || !Game.player) return;
    const p = Game.player;
    const bx = this.cx;
    const by = this.y + this.h;
    const speed = 300;
    // Aim toward the player but always keep a strong downward component.
    const ang = Math.atan2(p.cy - this.cy, p.cx - this.cx);
    let vx = Math.cos(ang) * speed;
    let vy = Math.abs(Math.sin(ang)) * speed + 120; // force downward
    Game.enemyBullets.push({ x: bx, y: by, vx, vy, w: 3, h: 8 });
  }

  /** Draw the enemy sprite; rotate toward travel direction while diving. */
  render(ctx) {
    const frame = Math.floor(this.time * 4) % 2;
    ctx.save();
    if (this.state === "diving" || this.state === "returning") {
      // Point the sprite along its velocity vector.
      const angle = Math.atan2(this.vy, this.vx);
      ctx.translate(this.cx, this.cy);
      ctx.rotate(angle + Math.PI / 2); // sprites face "up", so offset by 90deg
      drawSprite(ctx, this.type, frame, -this.w / 2, -this.h / 2, 1);
    } else {
      drawSprite(ctx, this.type, frame, this.x, this.y, 1);
    }
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------------
 * Boss (Task 3.2)
 * -------------------------------------------------------------------------
 * A large boss entity using the 'boss' sprite at ~2x scale. Appears every 4th
 * wave (wave % 4 === 0). Enters from the top, hovers near the upper area, and
 * strafes side to side. Fires spread volleys (3-5 bullets in a fan) toward the
 * player every `fireRate` seconds. On death: multiple particle bursts + big
 * shake + high point award.
 * ------------------------------------------------------------------------- */
class Boss {
  constructor(spec) {
    // spec: an entry from BOSS_ROSTER (name, sprite, hp, points, fireRate, scaleW).
    const s = spec || BOSS_ROSTER[0];
    this.sprite = s.sprite;
    this.name = s.name;
    // On-screen size driven by the sprite's target width.
    this.w = s.scaleW;
    this.h = Math.round(s.scaleW * 0.85); // boss art is roughly square-ish
    this.hp = s.hp;
    this.maxHp = s.hp;
    this.points = s.points;
    this.x = W / 2 - this.w / 2;
    this.y = -this.h;
    this.state = "entering"; // entering -> active
    this.time = 0;
    this.hoverX = W / 2;     // horizontal center the boss strafes around
    this.hoverY = 90;        // vertical band the boss hovers around
    this.strafeX = 0;        // strafe phase
    this.fireRate = s.fireRate; // seconds between spread volleys
    this.fireTimer = 1.2;
    this.dead = false;
    this.deathT = 0;         // drives the multi-burst death sequence
  }

  /** Reposition the boss's hover center (used to spread multiple bosses). */
  setHover(x, y) {
    this.hoverX = x;
    this.hoverY = y;
    if (this.state === "entering") {
      this.x = x - this.w / 2;
      this.y = -this.h;
    }
  }

  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }

  /** Fire a fan of 3-5 bullets toward the player. */
  _fireVolley(player) {
    if (!player) return;
    const n = 3 + Math.floor(Math.random() * 3); // 3..5
    const spread = 0.5;                          // total fan width (radians)
    const baseAng = Math.atan2(player.cy - this.cy, player.cx - this.cx);
    const speed = 260;
    for (let i = 0; i < n; i++) {
      const f = n === 1 ? 0 : (i / (n - 1)) - 0.5; // -0.5 .. 0.5
      const a = baseAng + f * spread;
      Game.enemyBullets.push({
        x: this.cx,
        y: this.y + this.h * 0.7,
        vx: Math.cos(a) * speed,
        vy: Math.abs(Math.sin(a)) * speed + 140,
        w: 4,
        h: 10,
      });
    }
  }

  /** Advance the boss by dt seconds. */
  update(dt, player) {
    this.time += dt;

    if (this.state === "entering") {
      this.y += 120 * dt;
      if (this.y >= this.hoverY) {
        this.y = this.hoverY;
        this.state = "active";
      }
      return;
    }

    // Active: hover with a gentle vertical bob and horizontal strafe.
    this.strafeX += dt * 0.8;
    const range = Math.max(10, this.hoverX - this.w / 2 - 16);
    const strafe = Math.sin(this.strafeX) * range;
    this.x = this.hoverX - this.w / 2 + strafe;
    this.y = this.hoverY + Math.sin(this.time * 1.5) * 12;

    // Volley timer.
    this.fireTimer -= dt;
    if (this.fireTimer <= 0) {
      this._fireVolley(player);
      this.fireTimer = this.fireRate;
    }
  }

  /** Take a hit. Returns true if the boss just died. */
  hit() {
    this.hp -= 1;
    if (this.hp <= 0) {
      this.dead = true;
      this.deathT = 0;
      return true;
    }
    return false;
  }

  /**
   * Play out the death sequence over ~0.6s: several staggered particle bursts
   * plus a big screen shake. Call each frame while dead until fully done.
   * @returns {boolean} true when the death animation is complete
   */
  updateDeath(dt) {
    this.deathT += dt;
    const bursts = 5;
    const burstInterval = 0.12;
    const idx = Math.floor(this.deathT / burstInterval);
    if (idx < bursts && idx !== this._lastBurst) {
      this._lastBurst = idx;
      const ox = (Math.random() - 0.5) * this.w;
      const oy = (Math.random() - 0.5) * this.h;
      const colors = ["#39d353", "#9b3fe0", "#ffe23e", "#ff3b30"];
      if (Game.particleSystem) {
        Game.particleSystem.explode(
          this.cx + ox, this.cy + oy,
          colors[idx % colors.length], 30
        );
      }
      if (Game.screenshake) Game.screenshake.add(10);
      // Escalating explosion: small cracks build into a huge final detonation.
      // size ramps 0.25 -> 1.0 across the 5 bursts; shake grows with it too.
      const size = 0.25 + (idx / (bursts - 1)) * 0.75;
      if (sfx) sfx.boom(size);
      if (Game.screenshake) Game.screenshake.add(6 + Math.round(size * 14));
    }
    return this.deathT >= burstInterval * bursts;
  }

  /** Draw the boss sprite with animated frames. */
  render(ctx) {
    const frame = Math.floor(this.time * 6) % 4;
    // PNG path: draw centered on the boss's center at its target width.
    if (drawPngSprite(ctx, this.sprite, frame, this.cx, this.cy)) return;
    // Fallback: procedural 'boss' grid at 2x (legacy).
    drawSprite(ctx, "boss", frame, this.x, this.y, 2);
  }
}

/* ---------------------------------------------------------------------------
 * Formation builder (Task 3.2)
 * -------------------------------------------------------------------------
 * Builds the grid of slots near the top of the screen and assigns a type to
 * each slot following the classic Galaga layout: fighters on top (most points),
 * butterflies in the middle, bees on the bottom. Returns an array of Enemy
 * instances, staggered so they enter one-by-one.
 * ------------------------------------------------------------------------- */
function buildFormation(wave) {
  const enemies = [];
  const cols = 8;
  const rows = 4;
  const startX = W / 2 - ((cols - 1) * 56) / 2;
  const startY = 70;
  const gapX = 56;
  const gapY = 44;

  // Wave rotation: 4 rows = X / Y / Z / Z (rows 3+4 share). Explicit per-wave
  // table (loops every 6 waves). Row 2 is a fixed pufferfish mid-tier; row 1
  // cycles shark->angler->seadragon; rows 3+4 alternate jelly<->crab.
  const WAVE_TABLE = [
    ["raider",    "butterfly", "bee"],       // wave 1: shark / puff / jelly
    ["brute",     "butterfly", "shooter"],   // wave 2: angler / puff / crab
    ["fighter",   "butterfly", "bee"],       // wave 3: seadragon / puff / jelly
    ["raider",    "butterfly", "shooter"],   // wave 4: shark / puff / crab
    ["brute",     "butterfly", "bee"],       // wave 5: angler / puff / jelly
    ["fighter",   "butterfly", "shooter"],   // wave 6: seadragon / puff / crab
  ];
  const pick3 = WAVE_TABLE[((wave - 1) % 6 + 6) % 6];
  const rowTypes = [pick3[0], pick3[1], pick3[2], pick3[2]];

  let order = 0;
  for (let r = 0; r < rows; r++) {
    for (let cIdx = 0; cIdx < cols; cIdx++) {
      const sx = startX + cIdx * gapX;
      const sy = startY + r * gapY;
      const type = rowTypes[r];
      const e = new Enemy(type, { x: sx, y: sy });
      // Stagger the entry so enemies arrive one-by-one (spiral cascade).
      e.entryDur = 1.2 + order * 0.12;
      // Delay start by holding them higher up initially.
      e.y = -e.h - order * 18;
      enemies.push(e);
      order++;
    }
  }
  return enemies;
}

/* ---------------------------------------------------------------------------
 * PowerUp (Task 3.3)
 * -------------------------------------------------------------------------
 * A collectible that drops from destroyed fighters and falls slowly toward the
 * bottom of the screen. Four types, each with a distinct color + letter glyph:
 *   shield -> 5s invincibility bubble around the player
 *   triple -> 8s 3-way spread shot (player.spread = true while active)
 *   slow   -> 6s global enemy slowFactor (enemies move at 50% speed)
 *   bomb   -> single use: clears every enemy currently on screen
 * ------------------------------------------------------------------------- */
const POWERUP_TYPES = {
  shield: { color: "#3ef0ff", letter: "S", label: "SHIELD", sprite: "pu_shield" },
  triple: { color: "#ffe23e", letter: "T", label: "TRIPLE", sprite: "pu_triple" },
  slow:   { color: "#9b3fe0", letter: "S", label: "SLOW",   sprite: "pu_slow" },
  bomb:   { color: "#ff3b30", letter: "B", label: "BOMB",   sprite: "pu_bomb" },
};

class PowerUp {
  /**
   * @param {string} type one of 'shield' | 'triple' | 'slow' | 'bomb'
   * @param {number} x    center-x spawn position
   * @param {number} y    top spawn position
   */
  constructor(type, x, y) {
    this.type = type;
    const t = POWERUP_TYPES[type];
    this.color = t.color;
    this.letter = t.letter;
    this.label = t.label;
    this.sprite = t.sprite;
    this.x = x;          // center-x
    this.y = y;          // center-y
    this.r = 11;         // collision radius
    this.vy = 70;        // slow downward fall (px/s)
    this.wobblePhase = Math.random() * Math.PI * 2;
    this.time = 0;
    this.dead = false;
  }

  update(dt) {
    this.time += dt;
    this.y += this.vy * dt;
    // Gentle horizontal wobble so it reads as a floating pickup.
    this.x += Math.sin(this.time * 3 + this.wobblePhase) * 14 * dt;
    if (this.y - this.r > H) this.dead = true; // fell off the bottom
  }

  render(ctx) {
    ctx.save();
    // Prefer the animated PNG pickup; fall back to the colored disc + letter.
    const frame = Math.floor(this.time * 8) % 4;
    if (drawPngSprite(ctx, this.sprite, frame, this.x, this.y)) {
      ctx.restore();
      return;
    }
    // Soft pulsing glow ring.
    const pulse = 0.6 + 0.4 * Math.sin(this.time * 8);
    ctx.globalAlpha = 0.35 * pulse;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r + 4, 0, Math.PI * 2);
    ctx.fill();
    // Solid core disc.
    ctx.globalAlpha = 1;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
    // Letter glyph.
    ctx.fillStyle = "#000";
    ctx.font = "bold 13px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(this.letter, this.x, this.y + 1);
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------------
 * Game object skeleton
 * -------------------------------------------------------------------------
 * Provides the start()/update(dt)/render() contract the rest of the milestones
 * will build on. Drives the real Player ship (Task 3.1), its bullet array,
 * the parallax starfield background, and the VFX systems from Task 2.2.
 * ------------------------------------------------------------------------- */
const W = 480;   // internal canvas width
const H = 640;   // internal canvas height

/** Trace a horizontal hexagon (pointed left/right) centered at (cx, cy). */
function _hexPath(c, cx, cy, w, h) {
    const hw = w / 2, hh = h / 2;
    c.beginPath();
    c.moveTo(cx - hw * 0.5, cy - hh);   // top-left slant start
    c.lineTo(cx + hw * 0.5, cy - hh);   // top edge
    c.lineTo(cx + hw, cy);              // right point
    c.lineTo(cx + hw * 0.5, cy + hh);   // bottom edge
    c.lineTo(cx - hw * 0.5, cy + hh);
    c.lineTo(cx - hw, cy);              // left point
    c.closePath();
}

const Game = {
  canvas: document.getElementById("game"),
  ctx: null,
  running: false,
  lastTime: 0,
  wave: 1, // current wave number (drives music intensity)
  starfield: new Starfield(W, H), // parallax background layer (kept for stars)
  background: new Background(W, H), // scrolling underwater image backdrop
  time: 0,                        // accumulated game time (for sprite animation)

  /* -- Task 4.1: game state machine ---------------------------------------- */
  state: "title",        // 'title' | 'waveIntro' | 'playing' | 'bossFight' | 'paused' | 'gameOver'
  prevState: null,       // state we were in before pausing (for resume)
  jukeboxLabel: null,    // current jukebox track name shown on the title screen
  waveIntroTimer: 0,     // countdown for the "WAVE N" interstitial (~2s)
  gameOverTimer: 0,      // short delay before accepting restart on game-over
  newHighScore: false,   // set when this run beat the stored high score
  stats: { kills: 0, wavesCleared: 0 }, // per-run stats shown on game-over

  /* -- Task 2.2: VFX systems (initialized in start()) ----------------------- */
  particleSystem: null,
  screenshake: new ScreenShake(),
  muzzleFlash: new MuzzleFlash(),
  deathAnim: null,

  /* -- Task 3.1: player + projectiles -------------------------------------- */
  player: new Player(W / 2 - 20, H - 70),  // default ship; replaced on restart
  bullets: [],                    // active player bullets

  /* -- Task 3.2: enemies + boss -------------------------------------------- */
  enemies: [],                    // active Enemy instances (formation)
  enemyBullets: [],               // active enemy bullets (move downward)
  powerUps: [],                   // active PowerUp instances
  bosses: [],                    // active Boss instances for this wave

  /* -- Task 3.3: scoring, combo & power-ups -------------------------------- */
  score: 0,                       // running score for this run
  highScore: 0,                   // persisted best (localStorage 'galaga38_high')
  combo: 1,                       // current multiplier x1..x3
  comboTimer: 0,                  // seconds since last kill (resets combo at >2s)
  slowFactor: 1,                  // global enemy speed multiplier (SLOW power-up)
  _powerCycle: 0,                 // round-robin index so all 4 types appear
  _tripleTimer: null,             // remaining seconds of TRIPLE power-up
  _slowTimer: null,               // remaining seconds of SLOW power-up

  /* -- Music lifecycle ------------------------------------------------------
   * Clean entry/exit points so gameplay can start/stop the background loop.
   * Track selection is wave-driven (see _trackForWave); boss fights override
   * with the acid-jazz track and revert on clear. */
  startMusic() {
    if (music) {
      const t = this._trackForWave();
      music.start(t);
      console.log("[game] wave", this.wave, "->", t + 1, music.tracks[t].name);
    }
  },
  stopMusic() {
    if (music) music.stop();
  },
  /** Pick a track index for normal (non-boss) play based on the current wave. */
  _trackForWave() {
    return MusicSequencer.intensityForWave(this.wave);
  },
  setWave(n) {
    this.wave = Math.max(1, n);
    // If we're mid-play (not in a boss fight), switch to the wave's track live.
    if (music && music.playing && !this._anyBossAlive()) {
      music.setTrack(this._trackForWave());
    }
  },

  /**
   * How many bosses appear on a given wave. Every wave has at least one boss.
   * The count steps up every 3 waves: waves 1-3 -> 1, 4-6 -> 2, 7-9 -> 3, ...
   */
  _bossCountFor(wave) {
    return Math.floor((wave - 1) / 3) + 1;
  },

  /**
   * Build a fresh enemy formation for the current wave. Called at gameplay
   * start and after clearing a wave. Bosses are NOT spawned here — they
   * arrive only after the enemy wave is wiped out (see _spawnBosses).
   */
  setupWave() {
    this.enemies = buildFormation(this.wave);
    this.enemyBullets = [];
    this.bosses = [];
  },

  /**
   * Spawn this wave's boss group. Called once the enemy formation is cleared.
   * The count steps up every 3 waves (waves 1-3 -> 1, 4-6 -> 2, ...).
   */
  _spawnBosses() {
    const count = this._bossCountFor(this.wave);
    const bosses = [];
    for (let i = 0; i < count; i++) {
      // Cycle the roster so consecutive slots get different species.
      const idx = ((this.wave - 1) + i) % BOSS_ROSTER.length;
      const b = new Boss(BOSS_ROSTER[idx]);
      // Spread bosses across the top: single boss centers, multiples fan out.
      const frac = count === 1 ? 0.5 : (i + 1) / (count + 1);
      b.setHover(frac * W, 90);
      bosses.push(b);
    }
    this.bosses = bosses;
    if (sfx) sfx.waveIntro();
    // Boss fight begins: switch to the punk track (track 0).
    if (music && music.playing) {
      music.setTrack(0);
      console.log("[game] BOSS ->", 1, music.tracks[0].name);
    }
  },
