  // The real Player instance is created in start() (Task 3.1).
  // (Kept as a field so Input's shoot hook can read Game.player safely.)

  start() {
    this.ctx = this.canvas.getContext("2d");
    // Crisp pixel-art scaling for the PNG sprites.
    this.ctx.imageSmoothingEnabled = false;
    // Task 2.2: instantiate VFX systems (deathAnim shares particleSystem).
    this.particleSystem = new ParticleSystem();
    this.screenshake = new ScreenShake();
    this.muzzleFlash = new MuzzleFlash();
    this.deathAnim = new DeathAnim(this.particleSystem);
    this.damageVignette = new DamageVignette();
    // Task 3.1: create the real player ship + clear any leftover bullets.
    this.player = new Player(W / 2 - 20, H - 70);
    this.bullets = [];
    this.enemyBullets = [];
    this.powerUps = [];
    // Task 3.3: reset scoring state + load persisted high score.
    this.score = 0;
    this.combo = 1;
    this.comboTimer = 0;
    this.powerUps = [];
    this.slowFactor = 1;
    this._powerCycle = 0;
    try {
      const hs = parseInt(localStorage.getItem("galaga38_high"), 10);
      this.highScore = isNaN(hs) ? 0 : hs;
    } catch (e) { this.highScore = 0; }
    // Begin on the title screen. The render loop always runs so the starfield
    // animates for ambiance; gameplay entities only update in playing states.
    this.state = "title";
    this.running = true;
    this.lastTime = performance.now();
    this.background = new Background(W, H); // reset backdrop for fresh run
    // Splash art for the title screen.
    this.splash = new Image();
    const base = new URL("../", document.baseURI).href.replace(/[^/]*$/, "");
    this.splash.src = `${base}assets/abyss-qwen/splash_sheet.png`;
    requestAnimationFrame((t) => this.loop(t));
  },

  /* =========================================================================
   * Task 4.1 — Game state machine
   * ------------------------------------------------------------------------- */

  /**
   * Begin a fresh run from the title or game-over screen.
   * Resets the player, clears all entities, sets wave 1, builds the formation,
   * and transitions into the wave-intro interstitial with music started.
   */
  startGame() {
    // Reset player: full lives, centered position, no lingering power-ups.
    this.player = new Player(W / 2 - 20, H - 70);
    this.bullets = [];
    this.enemyBullets = [];
    this.powerUps = [];
    this.enemies = [];
    this.bosses = [];
    this.score = 0;
    this.combo = 1;
    this.comboTimer = 0;
    this.slowFactor = 1;
    this._tripleTimer = null;
    this._slowTimer = null;
    this._powerCycle = 0;
    this.newHighScore = false;
    this.stats = { kills: 0, wavesCleared: 0 };

    // First wave of the run.
    this.setWave(1);
    this.setupWave();

    // Music starts as soon as gameplay begins.
    this.startMusic();

    // Enter the "WAVE N" interstitial; it auto-advances to 'playing'.
    this.state = "waveIntro";
    this.waveIntroTimer = 2.0;
    if (sfx) sfx.waveIntro();
  },

  /** Freeze gameplay: stop updating entities and silence the music. */
  pause() {
    if (this.state !== "playing" && this.state !== "bossFight") return;
    this.prevState = this.state;
    this.state = "paused";
    this.stopMusic();
  },

  /** Resume from pause: restart the music at the current wave's intensity. */
  resume() {
    if (this.state !== "paused") return;
    this.state = this.prevState || "playing";
    this.startMusic();
  },

  /** True while any boss on the current wave is still alive. */
  _anyBossAlive() {
    return this.bosses.some((b) => !b.dead);
  },

  /** Advance the wave number and refresh music intensity live. */
  _advanceWave() {
    this.stats.wavesCleared += 1;
    this.setWave(this.wave + 1);   // reverts to the new wave's track (bosses cleared)
    this.setupWave();
    // Every wave has bosses that arrive after the enemy formation forms, so
    // we always play the short intro before dropping into active play.
    this.state = "waveIntro";
    this.waveIntroTimer = 2.0;
    if (sfx) sfx.waveIntro();
  },

  /** Enter the boss-fight HUD state once at least one boss is alive. */
  _enterBossFight() {
    if (this._anyBossAlive()) this.state = "bossFight";
  },

  /** Handle game-over: play SFX, stop music, record stats, enter gameOver. */
  _onGameOver() {
    this.newHighScore = this.score > 0 && this.score >= this.highScore;
    if (sfx) sfx.gameOver();
    this.stopMusic();
    this.state = "gameOver";
    this.gameOverTimer = 0.6; // brief lockout so we don't instantly restart
  },

  /**
   * Master update entry point. Delegates to the state machine so gameplay
   * entities only advance during 'playing' / 'bossFight', while the starfield
   * keeps drifting for ambiance on title/pause/game-over screens.
   */
  update(dt) {
    // Background + starfield always animate (ambiance on every screen).
    if (this.background) this.background.update(dt);
    this.starfield.update(dt);
    this._updateByState(dt);
  },

  /**
   * Fairness-oriented collision test. Accepts any mix of circle-based entities
   * ({x,y,r} or {cx,cy,r}) and AABB boxes ({x,y,w,h}), and returns true when
   * they overlap. Circles use a center-distance check; boxes use AABB overlap.
   */
  hitTest(a, b) {
    const ac = this._circleOf(a);
    const bc = this._circleOf(b);
    if (ac && bc) {
      // Circle vs circle: compare distance to summed radii.
      const dx = ac.x - bc.x, dy = ac.y - bc.y;
      const rr = ac.r + bc.r;
      return dx * dx + dy * dy <= rr * rr;
    }
    // Fall back to AABB for box/box or box/circle (approximated as its box).
    const ab = this._boxOf(a);
    const bb = this._boxOf(b);
    return ab.x < bb.x + bb.w && ab.x + ab.w > bb.x &&
           ab.y < bb.y + bb.h && ab.y + ab.h > bb.y;
  },

  /** Derive a {x,y,r} circle from an entity, or null if it's box-only. */
  _circleOf(e) {
    if (e.r != null) {
      if (e.cx != null) return { x: e.cx, y: e.cy, r: e.r };
      return { x: e.x, y: e.y, r: e.r }; // x/y treated as center
    }
    return null;
  },

  /** Derive an {x,y,w,h} box from an entity (center+radius -> bounding box). */
  _boxOf(e) {
    if (e.w != null && e.h != null) {
      // Only use center-based math when BOTH cx and cy are present; some
      // entities (e.g. Player) expose cx but not cy, which would otherwise
      // produce a NaN/null y and break every collision involving them.
      if (e.cx != null && e.cy != null) return { x: e.cx - e.w / 2, y: e.cy - e.h / 2, w: e.w, h: e.h };
      return { x: e.x, y: e.y, w: e.w, h: e.h };
    }
    // Circle-only entity: synthesize a square box around its center.
    const c = this._circleOf(e);
    return { x: c.x - c.r, y: c.y - c.r, w: c.r * 2, h: c.r * 2 };
  },

  /**
   * Award points for a kill, advancing the combo multiplier (x1 -> x2 -> x3).
   * A kill within 2s of the previous one raises/maintains the combo; otherwise
   * it starts fresh at x1. Persists the high score whenever it is exceeded.
   */
  _awardPoints(base, x, y) {
    // Combo: each kill resets the timer; multiplier climbs up to x3.
    this.comboTimer = 0;
    if (this.combo < 3) this.combo += 1; // first kill after idle bumps toward x2/x3
    const pts = base * this.combo;
    this.score += pts;
    this.stats.kills += 1;
    if (this.score > this.highScore) {
      this.highScore = this.score;
      try { localStorage.setItem("galaga38_high", String(this.highScore)); } catch (e) {}
    }
    // Floating score popup via particles (visual feedback only).
    if (Game.particleSystem) Game.particleSystem.explode(x, y, "#ffe23e", 6);
  },

  /** Spawn a power-up drop from a destroyed fighter (~25% chance). */
  _maybeDropPowerUp(x, y) {
    if (Math.random() > 0.10) return; // ~1 drop per 10 kills
    // Weighted random: shield/slow common, triple less, bomb rare.
    const r = Math.random();
    let type;
    if (r < 0.35)      type = "shield";
    else if (r < 0.70) type = "slow";
    else if (r < 0.90) type = "triple";
    else               type = "bomb";
    this.powerUps.push(new PowerUp(type, x, y));
  },

  /** Apply a collected power-up's effect to the game/player state. */
  _applyPowerUp(pu) {
    if (sfx) sfx.powerUp();
    switch (pu.type) {
      case "shield":
        // 5s invincibility bubble (rendered by Player while shieldTimer > 0).
        this.player.shieldTimer = Math.max(this.player.shieldTimer, 5);
        break;
      case "triple":
        // 8s 3-way spread shot.
        this.player.spread = true;
        this._tripleTimer = 8;
        break;
      case "slow":
        // 6s global enemy slow (enemies move at 50% speed).
        this.slowFactor = 0.5;
        this._slowTimer = 6;
        break;
      case "bomb":
        // Single use: clear every enemy currently on screen.
        this._triggerBomb();
        break;
    }
  },

  /** BOMB: multi-explosion that destroys all on-screen enemies. */
  _triggerBomb() {
    if (Game.screenshake) Game.screenshake.add(14);
    for (const e of this.enemies) {
      if (e.dead) continue;
      e.dead = true;
      if (Game.deathAnim) Game.deathAnim.killEntity(e, { flashTime: 0.08 });
      if (Game.particleSystem) Game.particleSystem.explode(e.cx, e.cy, "#ff9a1e", 20);
      this._awardPoints(e.points, e.cx, e.cy);
    }
    if (sfx) sfx.explode(2);
  },

  /**
   * F-key SFX preview: play every sound effect one at a time, showing its name
   * on screen (like the P jukebox). Music is stopped for the duration so the
   * effects are heard clearly, then resumed if it was playing before.
   */
  _previewSfx() {
    if (!sfx) return;
    // One effect per press, advancing each time — exactly like the P jukebox.
    const seq = [
      ["SHOOT",        () => sfx.shoot()],
      ["ENEMY POP",    () => sfx.pop()],
      ["ENEMY DIVE",   () => sfx.enemyDive()],
      ["POWER-UP",     () => sfx.powerUp()],
      ["BOOM (SMALL)", () => sfx.boom(0.4)],
      ["BOOM (MID)",   () => sfx.boom(0.7)],
      ["BOOM (BIG)",   () => sfx.boom(1.0)],
      ["WAVE INTRO",   () => sfx.waveIntro()],
      ["GAME OVER",    () => sfx.gameOver()],
    ];

    // First F starts at effect 0; each next F advances and wraps around.
    const started = this._sfxPreviewActive;
    this._sfxPreviewIndex = started ? (this._sfxPreviewIndex + 1) % seq.length : 0;
    this._sfxPreviewActive = true;

    const i = this._sfxPreviewIndex;
    const [name, fn] = seq[i];
    this.jukeboxLabel = name;
    fn();

    // Clear the label after the effect has had time to be heard.
    clearTimeout(this._sfxLabelTimer);
    this._sfxLabelTimer = setTimeout(() => { this.jukeboxLabel = null; }, 900);

    console.log("[sfx] F -> #" + (i + 1), name);
  },

  /** Tick active power-up timers (spread/slow durations) once per frame. */
  _tickPowerTimers(dt) {
    if (this._tripleTimer != null) {
      this._tripleTimer -= dt;
      if (this._tripleTimer <= 0) {
        this._tripleTimer = null;
        if (this.player) this.player.spread = false;
      }
    }
    if (this._slowTimer != null) {
      this._slowTimer -= dt;
      if (this._slowTimer <= 0) {
        this._slowTimer = null;
        this.slowFactor = 1;
      }
    }
  },

  /**
   * Resolve player-bullet vs enemy/boss collisions (award points, kill), and
   * enemy-bullet / enemy-body vs player collisions (register hits).
   */
  _resolveCollisions() {
    const p = this.player;

    // Player bullets hitting enemies / boss.
    for (let bi = this.bullets.length - 1; bi >= 0; bi--) {
      const b = this.bullets[bi];
      let consumed = false;

      // Check bosses first (they're bigger / more important).
      for (const boss of this.bosses) {
        if (boss.dead || !this.hitTest(b, boss)) continue;
        const died = boss.hit();
        if (!died && Game.particleSystem) {
          // Small spark where the bullet struck the hull.
          Game.particleSystem.explode(b.x, b.y, "#9b3fe0", 4);
        }
        consumed = true;
        break;
      }

      // Check each enemy.
      if (!consumed) {
        for (let ei = this.enemies.length - 1; ei >= 0; ei--) {
          const e = this.enemies[ei];
          if (e.dead) continue;
          if (this.hitTest(b, e)) {
            e.dead = true;
            if (Game.deathAnim) Game.deathAnim.killEntity(e, { flashTime: 0.08 });
            if (sfx) sfx.pop();
            this._awardPoints(e.points, e.cx, e.cy);
            this._maybeDropPowerUp(e.cx, e.cy);
            consumed = true;
            break;
          }
        }
      }

      if (consumed) this.bullets.splice(bi, 1);
    }

    // Enemy bullets hitting the player (blocked while shielded/invincible).
    for (let i = this.enemyBullets.length - 1; i >= 0; i--) {
      const b = this.enemyBullets[i];
      if (this.hitTest(b, p)) {
        this.enemyBullets.splice(i, 1);
        if (p.shieldTimer > 0 || p.invincible > 0) continue; // shield absorbs it
        if (p.hit()) this._onGameOver();
      }
    }

    // Diving enemies colliding with the player (ramming).
    for (const e of this.enemies) {
      if (e.dead) continue;
      if (e.state === "diving" && this.hitTest(e, p)) {
        e.dead = true;
        if (Game.deathAnim) Game.deathAnim.killEntity(e, { flashTime: 0.08 });
        if (p.shieldTimer > 0 || p.invincible > 0) continue; // shield absorbs it
        if (p.hit()) this._onGameOver();
      }
    }
  },

  render() {
    const c = this.ctx;
    // Clear to black.
    c.fillStyle = "#000";
    c.fillRect(0, 0, W, H);

    // Background layer: scrolling underwater image (always drawn, never shaken).
    if (this.background) this.background.render(c);

    // ---- World entities (inside the screen-shake translate) ----------------
    // Only draw gameplay entities when we're in an active or transitional state.
    const showWorld = this.state === "playing" || this.state === "bossFight" ||
                      this.state === "waveIntro" || this.state === "paused";
    if (showWorld) {
      this.screenshake.render(c, () => {
        if (this.enemies) for (const e of this.enemies) e.render(c);
        for (const boss of this.bosses) if (!boss.dead) boss.render(c);

        // Enemy bullets.
        if (this.enemyBullets) for (const b of this.enemyBullets) {
          c.fillStyle = "#ff5a1e";
          c.fillRect(b.x - b.w / 2, b.y, b.w, b.h);
          c.fillStyle = "#ffe23e";
          c.fillRect(b.x - b.w / 4, b.y + 1, b.w / 2, b.h - 2);
        }

        // Player ship.
        if (this.player) this.player.render(c);

        // Player bullets.
        if (this.bullets) for (const b of this.bullets) {
          c.fillStyle = "#3ef0ff";
          c.fillRect(b.x - b.w / 2, b.y, b.w, b.h);
          c.fillStyle = "#ffffff";
          c.fillRect(b.x - b.w / 4, b.y + 1, b.w / 2, b.h - 2);
        }

        // Power-ups.
        if (this.powerUps) for (const pu of this.powerUps) pu.render(c);

        // Death-flash overlays.
        if (this.deathAnim) this.deathAnim.render(c);

        // Particles.
        if (this.particleSystem) this.particleSystem.render(c);

        // Muzzle flash.
        if (this.muzzleFlash) this.muzzleFlash.render(c);
      });
    }

    // CoD-style red damage vignette — over the world, under the HUD/screens.
    if (this.damageVignette) this.damageVignette.render(c);

    // ---- State-specific screens & HUD ---------------------------------------
    switch (this.state) {
      case "title":
        this._renderTitle(c);
        break;
      case "waveIntro":
        this._renderHUD(c);
        this._renderWaveIntro(c);
        break;
      case "playing":
      case "bossFight":
        this._renderHUD(c);
        break;
      case "paused":
        this._renderHUD(c);
        this._renderPause(c);
        break;
      case "gameOver":
        this._renderGameOver(c);
        break;
    }
  },

  /* =========================================================================
   * Task 4.1 — Screen renderers
   * ------------------------------------------------------------------------- */

  /** Arcade-style title screen: big logo, high score, blinking start prompt. */
  _renderTitle(c) {
    const t = performance.now() / 1000;

    // Splash art as the title backdrop (covers the whole canvas).
    if (this.splash && this.splash.complete && this.splash.naturalWidth > 0) {
      c.drawImage(this.splash, 0, 0, W, H);
    } else {
      // Fallback until the image loads: dark gradient.
      const g = c.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#000010");
      g.addColorStop(1, "#001018");
      c.fillStyle = g;
      c.fillRect(0, 0, W, H);
    }

    // Darken the top third so the logo reads clearly over the kraken.
    const shade = c.createLinearGradient(0, 0, 0, H * 0.42);
    shade.addColorStop(0, "rgba(0,0,0,0.72)");
    shade.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = shade;
    c.fillRect(0, 0, W, H * 0.42);

    // ---- Logo lockup -------------------------------------------------------
    const bob = Math.sin(t * 1.5) * 3;
    const cy = 150 + bob;
    c.textAlign = "center";
    c.textBaseline = "middle";

    // Glow behind the wordmark.
    c.save();
    c.shadowColor = "#3ef0ff";
    c.shadowBlur = 24;
    // ABYSS
    c.font = "bold 64px 'Courier New', monospace";
    c.fillStyle = "#0a1830";
    c.fillText("ABYSS", W / 2 + 3, cy - 28 + 3);
    c.fillStyle = "#3ef0ff";
    c.fillText("ABYSS", W / 2, cy - 28);
    // QWEN
    c.font = "bold 64px 'Courier New', monospace";
    c.fillStyle = "#0a1830";
    c.fillText("QWEN", W / 2 + 3, cy + 34 + 3);
    c.fillStyle = "#ff5fd0";
    c.fillText("QWEN", W / 2, cy + 34);
    c.restore();

    // Version tag — a glowing hexagonal emblem under the wordmark.
    const vy = cy + 84;
    const vText = "3.8";
    c.font = "bold 30px 'Courier New', monospace";
    const tw = c.measureText(vText).width;
    const hexW = tw + 44;
    const hexH = 46;
    const cx0 = W / 2;
    // Pulsing glow.
    const vpulse = 0.5 + 0.5 * Math.sin(t * 3);
    c.save();
    // Outer glow ring.
    c.globalAlpha = 0.25 + 0.35 * vpulse;
    c.strokeStyle = "#ffe23e";
    c.lineWidth = 6;
    _hexPath(c, cx0, vy, hexW + 10, hexH + 10);
    c.stroke();
    // Solid hex body.
    c.globalAlpha = 1;
    c.fillStyle = "rgba(8, 16, 34, 0.9)";
    c.strokeStyle = "#ffe23e";
    c.lineWidth = 2.5;
    c.shadowColor = "#ffe23e";
    c.shadowBlur = 14 + 10 * vpulse;
    _hexPath(c, cx0, vy, hexW, hexH);
    c.fill();
    c.stroke();
    // Inner accent line.
    c.shadowBlur = 0;
    c.globalAlpha = 0.5;
    c.strokeStyle = "#fff2a0";
    c.lineWidth = 1;
    _hexPath(c, cx0, vy, hexW - 8, hexH - 8);
    c.stroke();
    // Text.
    c.globalAlpha = 1;
    c.fillStyle = "#ffe23e";
    c.shadowColor = "#ffe23e";
    c.shadowBlur = 12;
    c.fillText(vText, cx0, vy + 1);
    c.restore();

    // High score (in the darker upper-mid zone for contrast).
    c.font = "15px 'Courier New', monospace";
    c.fillStyle = "#cfe4ff";
    c.shadowColor = "#000";
    c.shadowBlur = 6;
    c.fillText(`HIGH SCORE: ${this.highScore || 0}`, W / 2, cy + 150);
    c.shadowBlur = 0;

    // Blinking "PRESS ENTER" prompt (on/off every ~500ms).
    if (Math.floor(t * 2) % 2 === 0) {
      c.font = "bold 20px 'Courier New', monospace";
      c.fillStyle = "#ffffff";
      c.shadowColor = "#3ef0ff";
      c.shadowBlur = 12;
      c.fillText("PRESS ENTER TO START", W / 2, H * 0.78);
      c.shadowBlur = 0;
    }

    // If audio is not unlocked yet, nudge the user — browsers block sound
    // until a real interaction creates/resumes the AudioContext.
    const audioReady = sfx && sfx.ctx.state === "running";
    if (!audioReady) {
      c.font = "bold 14px 'Courier New', monospace";
      c.fillStyle = "#ffe23e";
      c.shadowColor = "#ff9a1e";
      c.shadowBlur = 8;
      c.fillText("CLICK OR PRESS ANY KEY TO UNLOCK SOUND", W / 2, H * 0.84);
      c.shadowBlur = 0;
    }

    // Jukebox track name (shown after pressing P to preview a song).
    if (this.jukeboxLabel) {
      c.font = "bold 16px 'Courier New', monospace";
      c.fillStyle = "#ffe23e";
      c.shadowColor = "#000";
      c.shadowBlur = 8;
      c.fillText("\u25cf NOW PLAYING: " + this.jukeboxLabel, W / 2, H * 0.78 - 34);
      c.shadowBlur = 0;
    }

    // Key hints for the audio preview shortcuts.
    c.font = "13px 'Courier New', monospace";
    c.fillStyle = "#8fb8d8";
    c.textAlign = "center";
    c.fillText("[P] MUSIC   [F] SOUND FX   [M] MUTE", W / 2, H * 0.90);

    // Controls hint at the bottom, on a translucent rounded panel for legibility.
    c.save();
    c.font = "12px 'Courier New', monospace";
    const hintText = "\u2190/\u2192/WASD move \u00b7 SPACE shoot \u00b7 P pause \u00b7 M mute";
    const hw = c.measureText(hintText).width + 28;
    const hh = 24;
    const hx = W / 2 - hw / 2;
    const hy = H - 46;
    c.globalAlpha = 0.65;
    c.fillStyle = "#000";
    if (c.roundRect) {
      c.beginPath();
      c.roundRect(hx, hy, hw, hh, 6);
      c.fill();
    } else {
      c.fillRect(hx, hy, hw, hh);
    }
    c.globalAlpha = 1;
    c.fillStyle = "#bcd0f0";
    c.fillText(hintText, W / 2, hy + hh / 2 + 1);
    c.restore();

    c.textAlign = "left";
    c.textBaseline = "alphabetic";
  },

  /** Top-bar HUD: SCORE | HI | WAVE | LIVES icons | active power-up timer. */
  _renderHUD(c) {
    c.save();
    c.font = "bold 13px 'Courier New', monospace";
    c.textBaseline = "top";


    // Background strip for readability.
    c.fillStyle = "rgba(0,0,0,0.45)";
    c.fillRect(0, 0, W, 52);
    c.strokeStyle = "#2b3a7a";
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(0, 52);
    c.lineTo(W, 52);
    c.stroke();

    // --- Left column: SCORE / HI -------------------------------------------
    c.textAlign = "left";
    c.fillStyle = "#ffe23e";
    c.fillText(`SCORE ${String(this.score || 0).padStart(7, "0")}`, 10, 8);
    c.fillStyle = "#8fa0d0";
    c.font = "11px 'Courier New', monospace";
    c.fillText(`HI ${String(this.highScore || 0).padStart(7, "0")}`, 10, 26);

    // --- Center: WAVE --------------------------------------------------------
    c.textAlign = "center";
    c.font = "bold 13px 'Courier New', monospace";
    const bossCount = this.bosses.filter((b) => !b.dead).length;
    c.fillStyle = bossCount > 0 ? "#ff3b30" : "#3ef0ff";
    const waveLabel = bossCount > 0 ? `WAVE ${this.wave} · BOSS x${bossCount}` : `WAVE ${this.wave}`;
    c.fillText(waveLabel, W / 2, 8);

    // Combo indicator (only when above x1).
    if (this.combo > 1) {
      c.font = "11px 'Courier New', monospace";
      c.fillStyle = this.combo >= 3 ? "#ff3b30" : "#3ef0ff";
      c.fillText(`COMBO x${this.combo}`, W / 2, 26);
    }

    // --- Right: LIVES icons --------------------------------------------------
    c.textAlign = "right";
    c.font = "bold 13px 'Courier New', monospace";
    c.fillStyle = "#3ef0ff";
    c.fillText(`LIVES ${Math.max(0, this.player.lives)}`, W - 10, 8);
    // Ship icons (one per remaining life) — manta ray thumbnails.
    const lives = Math.max(0, this.player.lives);
    const pDef = PNG_SPRITES["player"];
    for (let i = 0; i < lives; i++) {
      const ix = W - 24 - (i + 1) * 22;
      const iy = 36;
      const f0 = pDef.frames[0];
      if (f0 && f0.complete && f0.naturalWidth > 0) {
        c.drawImage(f0, ix - 8, iy - 8, 16, 16);
      } else {
        c.fillStyle = "#3e7bff";
        c.fillRect(ix - 6, iy - 6, 12, 12);
      }
    }

    // --- Active power-up timers (below the bar) ------------------------------
    let py = 58;
    c.textAlign = "left";
    c.font = "11px 'Courier New', monospace";
    if (this.player && this.player.shieldTimer > 0) {
      c.fillStyle = POWERUP_TYPES.shield.color;
      c.fillText(`\u25cf SHIELD ${this.player.shieldTimer.toFixed(1)}s`, 10, py);
      py += 14;
    }
    if (this._tripleTimer != null && this._tripleTimer > 0) {
      c.fillStyle = POWERUP_TYPES.triple.color;
      c.fillText(`\u25cf TRIPLE ${this._tripleTimer.toFixed(1)}s`, 10, py);
      py += 14;
    }
    if (this._slowTimer != null && this._slowTimer > 0) {
      c.fillStyle = POWERUP_TYPES.slow.color;
      c.fillText(`\u25cf SLOW ${this._slowTimer.toFixed(1)}s`, 10, py);
      py += 14;
    }

    // Mute indicator (small, top-right corner).
    if (sfx && sfx.muted) {
      c.textAlign = "right";
      c.fillStyle = "#5a6a9a";
      c.font = "10px 'Courier New', monospace";
      c.fillText("[MUTED]", W - 10, 44);
    }

    c.restore();
  },

  /** Big centered "WAVE N" text that fades/scales in over ~2s. */
  _renderWaveIntro(c) {
    const elapsed = 2.0 - this.waveIntroTimer; // 0 -> 2
    const alpha = Math.min(1, elapsed / 0.5);  // fade in over first 0.5s
    const scale = 0.8 + 0.2 * Math.min(1, elapsed / 0.8); // slight zoom-in

    c.save();
    c.globalAlpha = alpha;
    c.textAlign = "center";
    c.textBaseline = "middle";
    c.translate(W / 2, H / 2);
    c.scale(scale, scale);

    const bossCount = this.bosses.filter((b) => !b.dead).length;
    const label = `WAVE ${this.wave}`;
    c.font = "bold 48px 'Courier New', monospace";
    c.fillStyle = "#1b3fbf";
    c.fillText(label, 3, 3);
    c.fillStyle = bossCount > 0 ? "#ff3b30" : "#3ef0ff";
    c.fillText(label, 0, 0);

    c.restore();
  },

  /** Dimmed semi-transparent overlay with "PAUSED" and resume hint. */
  _renderPause(c) {
    c.save();
    // Dim overlay.
    c.fillStyle = "rgba(0,0,0,0.6)";
    c.fillRect(0, 0, W, H);

    c.textAlign = "center";
    c.textBaseline = "middle";
    c.font = "bold 42px 'Courier New', monospace";
    c.fillStyle = "#ffffff";
    c.fillText("PAUSED", W / 2, H / 2 - 20);

    c.font = "16px 'Courier New', monospace";
    c.fillStyle = "#8fa0d0";
    c.fillText("Press P to resume", W / 2, H / 2 + 24);
    c.restore();
  },

  /** Game-over screen: final score, high score, NEW HIGH banner, restart prompt. */
  _renderGameOver(c) {
    const t = performance.now() / 1000;

    // Dim overlay.
    c.fillStyle = "rgba(0,0,0,0.7)";
    c.fillRect(0, 0, W, H);

    c.textAlign = "center";
    c.textBaseline = "middle";

    // "GAME OVER" header.
    c.font = "bold 44px 'Courier New', monospace";
    c.fillStyle = "#1b3fbf";
    c.fillText("GAME OVER", W / 2 + 3, 180 + 3);
    c.fillStyle = "#ff3b30";
    c.fillText("GAME OVER", W / 2, 180);

    // Stats block.
    c.font = "16px 'Courier New', monospace";
    c.fillStyle = "#cfd8ff";
    c.fillText(`FINAL SCORE: ${this.score}`, W / 2, 260);
    c.fillStyle = "#8fa0d0";
    c.fillText(`HIGH SCORE: ${this.highScore}`, W / 2, 288);
    c.fillText(`WAVES CLEARED: ${this.stats.wavesCleared}`, W / 2, 316);
    c.fillText(`ENEMIES DESTROYED: ${this.stats.kills}`, W / 2, 344);

    // "NEW HIGH!" banner (pulsing) if applicable.
    if (this.newHighScore) {
      const pulse = 0.6 + 0.4 * Math.sin(t * 4);
      c.save();
      c.globalAlpha = pulse;
      c.font = "bold 28px 'Courier New', monospace";
      c.fillStyle = "#ffe23e";
      c.fillText("\u2605 NEW HIGH! \u2605", W / 2, 400);
      c.restore();
    }

    // Restart prompt (blinking).
    if (this.gameOverTimer <= 0 && Math.floor(t * 2) % 2 === 0) {
      c.font = "bold 18px 'Courier New', monospace";
      c.fillStyle = "#ffffff";
      c.fillText("PRESS ENTER", W / 2, 470);
    }

    c.textAlign = "left";
    c.textBaseline = "alphabetic";
  },

  loop(now) {
    if (!this.running) return;
    const dt = Math.min((now - this.lastTime) / 1000, 0.05); // cap dt (tab-switch safety)
    this.lastTime = now;
    this.update(dt);
    this.render();
    requestAnimationFrame((t) => this.loop(t));
  },

  /* =========================================================================
   * Task 4.1 — State-gated update & render
   * ------------------------------------------------------------------------- */

  /**
   * Master update: routes to the right per-state logic. The starfield always
   * animates for ambiance (title/pause/game-over); gameplay entities only
   * update during 'playing' and 'bossFight'.
   */
  _updateByState(dt) {
    switch (this.state) {
      case "title":
        // Ambient only: starfield scrolls, nothing else.
        break;

      case "waveIntro": {
        // Count down the interstitial, then drop into active play. Bosses only
        // spawn after the enemy wave is cleared, so the intro always leads to
        // the normal 'playing' state.
        this.waveIntroTimer -= dt;
        if (this.waveIntroTimer <= 0) {
          this.state = "playing";
        }
        break;
      }

      case "playing":
      case "bossFight":
        this._updateGameplay(dt);
        break;

      case "paused":
        // Fully frozen: no entity updates, no VFX advancement. Music already stopped.
        break;

      case "gameOver":
        // Let lingering particles/shake finish for a clean fade, but freeze gameplay.
        if (this.particleSystem) this.particleSystem.update(dt);
        if (this.screenshake) this.screenshake.update(dt);
        if (this.deathAnim) this.deathAnim.update(dt);
        if (this.muzzleFlash) this.muzzleFlash.update(dt);
        if (this.gameOverTimer > 0) this.gameOverTimer -= dt;
        break;
    }
  },

  /**
   * Full gameplay tick (player, bullets, enemies, boss, power-ups, collisions,
   * VFX). Called only from 'playing' / 'bossFight'.
   */
  _updateGameplay(dt) {
    this.time += dt;
    this.starfield.update(dt);

    // Player ship movement + shooting.
    this.player.time = this.time;
    this.player.update(dt, Input);
    if (Input.down("Space")) {
      const fired = this.player.shoot();
      for (const b of fired) this.bullets.push(b);
    }

    // Advance player bullets upward and cull off-screen ones.
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.y + b.h < 0 || b.x + b.w < 0 || b.x > W) this.bullets.splice(i, 1);
    }

    // Enemies + boss (with the global SLOW factor applied to enemy motion).
    const sdt = dt * this.slowFactor;
    for (const e of this.enemies) e.update(sdt, this.player, this.wave);

    // Bosses: advance each; play out death sequences and award points.
    for (const boss of this.bosses) {
      if (boss.dead) {
        if (boss.updateDeath(dt)) {
          if (Game.screenshake) Game.screenshake.add(16);
          this._awardPoints(boss.points, boss.cx, boss.cy);
        }
      } else {
        boss.update(sdt, this.player);
      }
    }

    // Enemy bullets downward + cull.
    for (let i = this.enemyBullets.length - 1; i >= 0; i--) {
      const b = this.enemyBullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.y > H || b.x < 0 || b.x > W) this.enemyBullets.splice(i, 1);
    }

    // Collisions: player bullets vs enemies/boss, enemy bullets/body vs player.
    this._resolveCollisions();

    // Power-ups: advance, cull, and apply pickups.
    for (let i = this.powerUps.length - 1; i >= 0; i--) {
      const pu = this.powerUps[i];
      pu.update(dt);
      if (pu.dead) { this.powerUps.splice(i, 1); continue; }
      if (this.hitTest(pu, this.player)) {
        this._applyPowerUp(pu);
        this.powerUps.splice(i, 1);
      }
    }

    // Combo decay.
    if (this.comboTimer > 0) {
      this.comboTimer += dt;
      if (this.comboTimer > 2 && this.combo > 1) this.combo = 1;
    }

    // Tick power-up duration timers.
    this._tickPowerTimers(dt);

    // Cull dead enemies.
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      if (this.enemies[i].dead) this.enemies.splice(i, 1);
    }

    // Wave progression in two phases:
    //   Phase A — enemy formation still on screen: just fight them.
    //   Phase B — enemies wiped out: spawn the boss group (once), then fight it.
    // The wave advances only after the bosses are also destroyed. A short hold
    // after each phase's final kill prevents an instant, jarring transition.
    if (this.enemies.length === 0) {
      // Enemies gone. If we haven't spawned this wave's bosses yet, do it now.
      if (this.bosses.length === 0) {
        this._spawnBosses();
        this._clearHold = 0;
      } else if (!this._anyBossAlive()) {
        // Bosses dead too -> advance to the next wave.
        this._clearHold = (this._clearHold || 0) + dt;
        if (this._clearHold >= 1.2) {
          this._clearHold = 0;
          this._advanceWave();
        }
      }
    } else {
      this._clearHold = 0;
    }
    // Show the boss-fight HUD while any boss is alive.
    if (this.state === "playing" && this._anyBossAlive()) {
      this._enterBossFight();
    }

    // VFX systems.
    if (this.particleSystem) this.particleSystem.update(dt);
    if (this.screenshake) this.screenshake.update(dt);
    if (this.muzzleFlash) this.muzzleFlash.update(dt);
    if (this.deathAnim) this.deathAnim.update(dt);
    if (this.damageVignette) this.damageVignette.update(dt);
  },
};

/* ---------------------------------------------------------------------------
 * Boot
 * ------------------------------------------------------------------------- */
Input.init();
Game.start();
// Debug handle for console inspection (harmless in production).
window.__dbg = { Game, BOSS_ROSTER, PNG_SPRITES };
</script>
