<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Galaga 3.8 — SFX Scaffold</title>
<style>
  /* ---- Minimal page styling: center the canvas on a dark arcade backdrop ---- */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #05060a;
    color: #cfd8ff;
    font-family: "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #game {
    /* Internal resolution stays fixed at 480x640 (canvas width/height attrs).
       We CSS-scale the element to fit the viewport while preserving the 3:4
       aspect ratio (letterboxed by the flex-centered body). The logical
       coordinate system never changes — rendering always happens in 480x640. */
    image-rendering: pixelated;
    border: 2px solid #2b3a7a;
    box-shadow: 0 0 40px rgba(60, 90, 255, 0.35);
    background: #000;
    aspect-ratio: 3 / 4;
    max-width: calc(100vw - 48px);
    max-height: calc(100vh - 48px);
    width: auto;
    height: auto;
    /* Default size before either constraint kicks in. */
    width: min(calc((100vh - 48px) * 0.75), calc(100vw - 48px));
  }
  #hint {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    opacity: 0.6;
    letter-spacing: 1px;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game" width="480" height="640"></canvas>
<div id="hint">ENTER start &nbsp; &middot; &nbsp; &larr;/&rarr;/WASD move &nbsp; &middot; &nbsp; SPACE shoot &nbsp; &middot; &nbsp; P pause &nbsp; &middot; &nbsp; M mute</div>

<script>
"use strict";

/* ============================================================================
 * Galaga 3.8 — Milestone 1, Task 1.1: SFX Synthesizer + Game Scaffold
 * ----------------------------------------------------------------------------
 * A single self-contained HTML file. All audio is synthesized at runtime with
 * the Web Audio API (oscillators, gain envelopes, filters) — no external files.
 * ==========================================================================*/

/* ---------------------------------------------------------------------------
 * SfxEngine
 * -------------------------------------------------------------------------
 * Wraps an AudioContext and exposes one method per game event. Every sound is
 * built from oscillators / noise buffers routed through a gain envelope into a
 * shared master gain node (which also carries the mute flag).
 *
 * Envelope helper: `env(gainNode, t0, peak, attack, decay)` shapes a gain
 * param over time using linear ramps so there are no clicks.
 * ------------------------------------------------------------------------- */
class SfxEngine {
  constructor(ctx) {
    this.ctx = ctx;

    // Master gain: single volume knob for everything we synthesize.
    this.master = ctx.createGain();
    this.master.gain.value = 0.6;          // overall volume (0..1)
    this.master.connect(ctx.destination);

    this.muted = false;

    // Pre-build a short white-noise buffer reused by every noise-based SFX.
    // 1 second of random samples is plenty for bursts; we slice it per use.
    const len = Math.floor(ctx.sampleRate * 1.0);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    this.noiseBuffer = buf;
  }

  /** Toggle global mute. Returns current muted state. */
  setMute(on) {
    this.muted = !!on;
    // Ramp to avoid a hard click when toggling mid-sound.
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setTargetAtTime(this.muted ? 0 : 0.6, t, 0.01);
    return this.muted;
  }

  /* -- internal helpers ---------------------------------------------------- */

  /**
   * Apply a simple ADSR-ish envelope to a GainNode starting at time t0.
   * Linear ramp up to `peak` over `attack`, then exponential decay to ~0
   * over `decay`. ExponentialRampToValueAtTime can't target 0, so we floor it.
   */
  _env(g, t0, peak, attack, decay) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);
  }

  /** Create a source->gain chain connected to master; returns the gain node. */
  _chain(source) {
    const g = this.ctx.createGain();
    source.connect(g);
    g.connect(this.master);
    return g;
  }

  /** Play a white-noise burst through an optional lowpass filter. */
  _noiseBurst({ duration = 0.3, peak = 0.5, cutoff = 4000, q = 0.7 } = {}) {
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer;
    const filt = this.ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.value = cutoff;
    filt.Q.value = q;
    const g = this._chain(src);
    g.connect(filt);
    // Re-route: source -> filter -> gain -> master
    src.disconnect();
    src.connect(filt);
    filt.connect(g);

    const t0 = this.ctx.currentTime;
    this._env(g, t0, peak, 0.005, duration);
    src.start(t0);
    src.stop(t0 + duration + 0.05);
  }

  /* -- public SFX methods -------------------------------------------------- */

  /** Short square-wave blip with a pitch drop — player laser fire. */
  shoot() {
    const t0 = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = "square";
    osc.frequency.setValueAtTime(880, t0);            // start high
    osc.frequency.exponentialRampToValueAtTime(220, t0 + 0.12); // drop fast
    const g = this._chain(osc);
    this._env(g, t0, 0.25, 0.005, 0.12);
    osc.start(t0);
    osc.stop(t0 + 0.16);
  }

  /**
   * Explosion: filtered noise burst + a low sine thump.
   * `size` (default 1) scales both loudness and duration so small enemy
   * pops differ audibly from big boss blasts.
   */
  explode(size = 1) {
    size = Math.max(0.25, Math.min(size, 3)); // clamp for sanity
    const dur = 0.25 + 0.25 * size;           // longer for bigger booms
    const vol = 0.35 * size;

    // Noise component, lowpassed so it reads as "boom" not "crackle".
    this._noiseBurst({
      duration: dur,
      peak: vol,
      cutoff: 1200 + 800 * size,
      q: 0.8,
    });

    // Low sine thump that gives the explosion its weight.
    const t0 = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(160, t0);
    osc.frequency.exponentialRampToValueAtTime(40, t0 + dur);
    const g = this._chain(osc);
    this._env(g, t0, vol, 0.01, dur);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  /** Descending sawtooth sweep — an enemy breaking formation to dive. */
  enemyDive() {
    const t0 = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(1200, t0);
    osc.frequency.exponentialRampToValueAtTime(150, t0 + 0.5);
    // Light lowpass keeps the saw from being too harsh.
    const filt = this.ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.value = 3000;
    const g = this._chain(osc);
    osc.connect(filt);
    filt.connect(g);
    this._env(g, t0, 0.22, 0.02, 0.5);
    osc.start(t0);
    osc.stop(t0 + 0.55);
  }

  /** Ascending 4-note arpeggio — power-up collected. */
  powerUp() {
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    const step = 0.09;                              // seconds between notes
    const t0 = this.ctx.currentTime;
    notes.forEach((freq, i) => {
      const t = t0 + i * step;
      const osc = this.ctx.createOscillator();
      osc.type = "triangle";                        // warm, pleasant timbre
      osc.frequency.value = freq;
      const g = this._chain(osc);
      this._env(g, t, 0.3, 0.01, 0.18);
      osc.start(t);
      osc.stop(t + 0.22);
    });
  }

  /**
   * Dramatic chord hit — wave intro. Several oscillators struck together
   * with slightly different waveforms for a rich, percussive stab.
   */
  waveIntro() {
    const t0 = this.ctx.currentTime;
    // A minor-ish power chord with a fifth and octave for drama.
    const voices = [
      { type: "sawtooth", freq: 110.00, peak: 0.18 }, // A2
      { type: "sawtooth", freq: 164.81, peak: 0.14 }, // E3
      { type: "square",   freq: 220.00, peak: 0.12 }, // A3
      { type: "sine",     freq: 440.00, peak: 0.10 }, // A4 sparkle
    ];
    // Shared lowpass so the stacked saws don't alias harshly.
    const filt = this.ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.setValueAtTime(6000, t0);
    filt.frequency.exponentialRampToValueAtTime(800, t0 + 0.8);
    filt.Q.value = 1.2;
    filt.connect(this.master);

    voices.forEach((v) => {
      const osc = this.ctx.createOscillator();
      osc.type = v.type;
      osc.frequency.value = v.freq;
      const g = this.ctx.createGain();
      osc.connect(g);
      g.connect(filt);
      this._env(g, t0, v.peak, 0.01, 0.8);
      osc.start(t0);
      osc.stop(t0 + 0.85);
    });
  }

  /** Long descending tone — game over. */
  gameOver() {
    const t0 = this.ctx.currentTime;
    const dur = 1.6;
    const osc = this.ctx.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(440, t0);
    osc.frequency.exponentialRampToValueAtTime(55, t0 + dur);
    const filt = this.ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.value = 2000;
    const g = this._chain(osc);
    osc.connect(filt);
    filt.connect(g);
    this._env(g, t0, 0.3, 0.05, dur);
    osc.start(t0);
    osc.stop(t0 + dur + 0.1);
  }
}

/* ---------------------------------------------------------------------------
 * MusicSequencer
 * -------------------------------------------------------------------------
 * A looping background-music sequencer built on top of the SfxEngine's shared
 * AudioContext + master gain (so the M-key mute silences music too).
 *
 * Architecture: a setInterval "scheduler" runs at a fixed cadence and looks
 * `lookahead` seconds ahead of `audioContext.currentTime`, scheduling every
 * step that falls in that window with sample-accurate start times. Because we
 * schedule slightly ahead of time rather than firing notes "now", playback is
 * gap-free even if the interval jitters.
 *
 * Three voices per 16th-note step:
 *   - bass line      (low square/sawtooth)
 *   - lead melody    (triangle, gated by intensity for density)
 *   - hi-hat ticks   (short filtered noise bursts)
 *
 * Intensity (1..5) drives tempo, note density, and a lowpass cutoff so higher
 * waves sound faster / denser / brighter.
 * ------------------------------------------------------------------------- */
class MusicSequencer {
  constructor(sfx) {
    this.sfx = sfx;
    this.ctx = sfx.ctx;
    this.master = sfx.master; // shared master gain -> M mute affects us too

    // Reuse the SfxEngine's pre-built white-noise buffer for hi-hats.
    this.noiseBuffer = sfx.noiseBuffer;

    // --- Musical data -------------------------------------------------------
    // Bass root pattern over 2 bars (16 steps each), in Hz. A-minor-ish groove.
    this.bassLine = [
      55.00, 55.00, 110.00, 55.00,  65.41, 65.41, 130.81, 65.41, // bar 1 (A1/E2)
      73.42, 73.42, 146.83, 73.42,  82.41, 82.41, 164.81, 82.41, // bar 2 (D2/G2)
    ];
    // Lead melody: null = rest. Frequencies in Hz (A minor pentatonic-ish).
    this.leadLine = [
      440.00, null, 523.25, 440.00,  659.25, null, 587.33, null,
      523.25, 440.00, null, 392.00,  440.00, null, 523.25, null,
    ];

    // --- Scheduler state ----------------------------------------------------
    this.playing = false;
    this.intensity = 1;
    this.stepIndex = 0;       // next 16th-note to schedule
    this.nextNoteTime = 0;    // audio-clock time of next step
    this.timerId = null;
    this._liveOscs = new Set(); // scheduled-but-not-yet-finished sources (for stop())

    // Cadence/lookahead tuned for sample-accurate, gap-free playback.
    this.lookahead = 0.12;    // seconds we schedule ahead
    this.tickMs = 25;         // how often the scheduler wakes up
  }

  /** Map wave number (>=1) to an intensity 1..5. */
  static intensityForWave(wave) {
    return Math.max(1, Math.min(5, Math.round(wave)));
  }

  /** Tempo (BPM) for a given intensity — rises as intensity climbs. */
  _tempoFor(intensity) {
    // 90 BPM at intensity 1, up to ~168 BPM at intensity 5.
    return 90 + (intensity - 1) * 19.5;
  }

  /** Lowpass cutoff for the music bus — brighter at higher intensity. */
  _cutoffFor(intensity) {
    return 900 + (intensity - 1) * 1400; // 900 .. 6500 Hz
  }

  /** Start (or restart) the loop at a wave-appropriate tempo. */
  start(wave) {
    const intensity = MusicSequencer.intensityForWave(wave);
    this.stop(); // clean slate if already running
    this.intensity = intensity;
    this.playing = true;
    this.stepIndex = 0;
    this.nextNoteTime = this.ctx.currentTime + 0.06; // small head start

    // Build a persistent music bus: source -> filter -> gain -> master.
    // We create the filter once so setIntensity can sweep its cutoff smoothly.
    this._busFilter = this.ctx.createBiquadFilter();
    this._busFilter.type = "lowpass";
    this._busFilter.frequency.value = this._cutoffFor(intensity);
    this._busFilter.Q.value = 0.8;
    this._busGain = this.ctx.createGain();
    this._busGain.gain.value = 0.5; // keep music under the SFX level
    this._busFilter.connect(this._busGain);
    this._busGain.connect(this.master);

    this.timerId = setInterval(() => this._schedule(), this.tickMs);
  }

  /** Stop cleanly: clear the timer and silence any still-scheduled voices. */
  stop() {
    if (this.timerId !== null) {
      clearInterval(this.timerId);
      this.timerId = null;
    }
    this.playing = false;
    // Kill any oscillators/noise we scheduled but haven't finished yet.
    const t = this.ctx.currentTime;
    this._liveOscs.forEach((node) => {
      try { node.stop(t + 0.02); } catch (e) { /* already stopped */ }
    });
    this._liveOscs.clear();
    // Tear down the bus (if present) so no dangling nodes linger.
    if (this._busFilter) {
      try { this._busFilter.disconnect(); } catch (e) {}
      this._busFilter = null;
    }
    if (this._busGain) {
      try { this._busGain.disconnect(); } catch (e) {}
      this._busGain = null;
    }
  }

  /**
   * Change musical intensity live (1..5). Adjusts tempo, density, and the
   * bus filter cutoff without restarting the loop.
   */
  setIntensity(n) {
    n = Math.max(1, Math.min(5, Math.round(n)));
    this.intensity = n;
    if (this._busFilter) {
      const t = this.ctx.currentTime;
      this._busFilter.frequency.cancelScheduledValues(t);
      this._busFilter.frequency.setTargetAtTime(this._cutoffFor(n), t, 0.1);
    }
  }

  /* -- internal ------------------------------------------------------------ */

  /** Scheduler tick: schedule every step falling within the lookahead window. */
  _schedule() {
    while (this.nextNoteTime < this.ctx.currentTime + this.lookahead) {
      this._playStep(this.stepIndex, this.nextNoteTime);
      const spb = 60.0 / this._tempoFor(this.intensity); // sec per beat
      this.nextNoteTime += spb / 4;                      // one 16th note
      this.stepIndex = (this.stepIndex + 1) % this.bassLine.length;
    }
  }

  /** Schedule one 16th-note step at exact audio-clock time `t`. */
  _playStep(step, t) {
    const i = this.intensity;
    // Hi-hat: every 8th note at low intensity, every 16th at high intensity.
    const hatEvery = i >= 4 ? 1 : 2;
    if (step % hatEvery === 0) this._hat(t, i);
    // Bass: play on the step's root; gate some off at low intensity for space.
    const bassFreq = this.bassLine[step];
    if (bassFreq && (i >= 3 || step % 2 === 0)) this._bass(t, bassFreq, i);
    // Lead: only when the slot has a note AND density allows it.
    const leadFreq = this.leadLine[step];
    // Density gate: at low intensity play fewer lead notes (every other step).
    const leadGate = i >= 3 ? 1 : 2;
    if (leadFreq && step % leadGate === 0) this._lead(t, leadFreq, i);
  }

  /** Low square/sawtooth bass note through the music bus. */
  _bass(t, freq, i) {
    const osc = this.ctx.createOscillator();
    osc.type = i >= 4 ? "sawtooth" : "square";
    osc.frequency.setValueAtTime(freq, t);
    const g = this.ctx.createGain();
    const dur = 0.16;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.35, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g);
    g.connect(this._busFilter);
    osc.start(t);
    osc.stop(t + dur + 0.02);
    this._track(osc, t + dur + 0.05);
  }

  /** Triangle lead note, slightly detuned for movement, through the bus. */
  _lead(t, freq, i) {
    const osc = this.ctx.createOscillator();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(freq, t);
    // Subtle vibrato-like pitch drift for a livelier tone at high intensity.
    if (i >= 4) osc.frequency.linearRampToValueAtTime(freq * 1.02, t + 0.1);
    const g = this.ctx.createGain();
    const dur = 0.14;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.22, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g);
    g.connect(this._busFilter);
    osc.start(t);
    osc.stop(t + dur + 0.02);
    this._track(osc, t + dur + 0.05);
  }

  /** Short filtered-noise hi-hat tick through the bus. */
  _hat(t, i) {
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer;
    const filt = this.ctx.createBiquadFilter();
    filt.type = "highpass";
    filt.frequency.value = 6000 + i * 800; // brighter hats at higher intensity
    const g = this.ctx.createGain();
    const dur = 0.04;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.12, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filt);
    filt.connect(g);
    g.connect(this._busFilter);
    src.start(t);
    src.stop(t + dur + 0.02);
    this._track(src, t + dur + 0.05);
  }

  /** Track a scheduled source so stop() can kill it; auto-remove after done. */
  _track(node, doneAt) {
    this._liveOscs.add(node);
    setTimeout(() => { this._liveOscs.delete(node); }, (doneAt - this.ctx.currentTime) * 1000 + 50);
  }
}

/* ---------------------------------------------------------------------------
 * Input handler
 * -------------------------------------------------------------------------
 * Tracks currently-held keys in a Set. Keydown fires once per press
 * (auto-repeat ignored via e.repeat) which is what we want for actions like
 * shooting; held movement reads from the Set each frame.
 * ------------------------------------------------------------------------- */
const Input = {
  keys: new Set(),
  init() {
    window.addEventListener("keydown", (e) => {
      // First interaction unlocks audio (browser autoplay policy).
      ensureAudio();

      // Space / arrows prevent page scroll.
      if (e.code === "Space" || e.code.startsWith("Arrow")) e.preventDefault();

      // --- State transitions (fire once per press, ignore auto-repeat) -----
      if (!e.repeat) {
        const s = Game.state;
        // ENTER: start from title, restart from game-over.
        if (e.code === "Enter") {
          if (s === "title" || s === "gameOver") Game.startGame();
        }
        // P: pause / resume during active play.
        if (e.code === "KeyP") {
          if (s === "playing" || s === "bossFight") Game.pause();
          else if (s === "paused") Game.resume();
        }
        // M: mute / unmute across every state.
        if (e.code === "KeyM" && sfx) {
          sfx.setMute(!sfx.muted);
        }
      }

      Input.keys.add(e.code);
    });
    window.addEventListener("keyup", (e) => {
      Input.keys.delete(e.code);
    });
  },
  down(code) { return Input.keys.has(code); },
};

/* ---------------------------------------------------------------------------
 * Audio bootstrap
 * -------------------------------------------------------------------------
 * Browsers block AudioContext until a user gesture. We create the context and
 * SfxEngine lazily on the first keydown or click, then resume it if suspended.
 * ------------------------------------------------------------------------- */
let sfx = null;
let music = null;

function ensureAudio() {
  if (sfx) {
    if (sfx.ctx.state === "suspended") sfx.ctx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  sfx = new SfxEngine(ctx);
  // Create the background-music sequencer on the same context/master gain so
  // the M-key mute (which ramps sfx.master to 0) silences music as well.
  music = new MusicSequencer(sfx);
  if (ctx.state === "suspended") ctx.resume();
}

// Click anywhere on the canvas also unlocks audio (useful for touch/click).
document.getElementById("game").addEventListener("click", ensureAudio);

/* ---------------------------------------------------------------------------
 * Sprite System
 * -------------------------------------------------------------------------
 * Procedural pixel-art sprites defined as arrays of color-indexed strings.
 * Each character in a row maps to a palette color via `SPRITE_PALETTE`;
 * "." (or any char not in the palette) is transparent.
 *
 * Sizes: player 24x20, bee 20x16, butterfly 24x20, fighter 28x24, boss 48x40.
 * Every enemy type has 2 animation frames (wing flap / leg pose change).
 * ------------------------------------------------------------------------- */

// Shared palette: single-char key -> CSS color. Kept arcade-bright.
const SPRITE_PALETTE = {
  // Whites / grays
  w: "#ffffff",
  g: "#c8c8d8",
  s: "#8a8aa0",
  // Blues / cyans (player)
  b: "#3e7bff",
  c: "#3ef0ff",
  d: "#1b3fbf",
  // Yellows / oranges (bee)
  y: "#ffe23e",
  o: "#ff9a1e",
  k: "#3a2a10",
  // Pinks / magentas (butterfly)
  p: "#ff5fd0",
  m: "#c020a0",
  f: "#ff9de0",
  // Reds (fighter)
  r: "#ff3b30",
  e: "#ff7a1e",
  n: "#7a1010",
  // Greens / purples (boss)
  v: "#39d353",
  u: "#1f8f3a",
  q: "#9b3fe0",
  t: "#5a1fa0",
  l: "#e0ffea",
};

/**
 * Normalize a frame's rows to a uniform width: pad short rows with "." and
 * truncate long ones. Guarantees clean rectangular sprites regardless of any
 * minor authoring width drift. Returns a new array of strings.
 */
function _normalizeFrame(rows) {
  // Target width = the widest row (the intended design width).
  let w = 0;
  for (const r of rows) if (r.length > w) w = r.length;
  return rows.map((r) => (r.length < w ? r + ".".repeat(w - r.length) : r.slice(0, w)));
}

/**
 * Render a named sprite at the given frame/position/scale.
 * @param {CanvasRenderingContext2D} ctx
 * @param {string} name  one of: player, bee, butterfly, fighter, boss
 * @param {number} frame  frame index (clamped to available frames)
 * @param {number} x      top-left x in canvas pixels
 * @param {number} y      top-left y in canvas pixels
 * @param {number} scale  integer pixel scale (default 1)
 */
function drawSprite(ctx, name, frame, x, y, scale = 1) {
  const def = SPRITES[name];
  if (!def) return;
  const rows = _normalizeFrame(def.frames[Math.max(0, Math.min(frame | 0, def.frames.length - 1))]);
  const px = Math.round(x);
  const py = Math.round(y);
  for (let ry = 0; ry < rows.length; ry++) {
    const row = rows[ry];
    for (let rx = 0; rx < row.length; rx++) {
      const ch = row[rx];
      if (ch === "." || ch === " ") continue;
      const col = SPRITE_PALETTE[ch];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(px + rx * scale, py + ry * scale, scale, scale);
    }
  }
}
