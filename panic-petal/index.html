<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Petal Panic</title>
  <style>
    /* Full-viewport black background; canvas centered (letterbox bars are just
       the page background showing around the 16:9 canvas). */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #game {
      display: block;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      /* image-rendering is set per art style in main.js if needed */
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="js/main.js"></script>
</body>
</html>
