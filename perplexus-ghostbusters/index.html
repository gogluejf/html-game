<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perplexus: Ghostbusters Edition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a1a; }
    canvas { display: block; }
    #ui {
      position: fixed; top: 20px; left: 20px;
      color: #00ffcc; font-family: 'Courier New', monospace; font-size: 18px;
      text-shadow: 0 0 10px #00ffcc; pointer-events: none; z-index: 10;
    }
    #title {
      position: fixed; top: 20px; right: 20px;
      color: #cc9900; font-family: 'Courier New', monospace; font-size: 14px;
      text-shadow: 0 0 10px #cc9900; pointer-events: none; z-index: 10;
    }
    #hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: #008866; font-family: 'Courier New', monospace; font-size: 14px;
      pointer-events: none; z-index: 10; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="ui"></div>
  <div id="title">PERPLEXUS: GHOSTBUSTERS EDITION</div>
  <div id="hint">Move mouse to tilt sphere &bull; Drag to orbit camera &bull; Guide proton ball to top &bull; Avoid ghosts!</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    // ─── Simple Orbit Camera ───────────────────────────────────────────────────
    class SimpleOrbit {
      constructor(camera, dom) {
        this.camera = camera;
        this.dom = dom;
        this.target = new THREE.Vector3();
        this.dampingFactor = 0.05;
        this.minDistance = 3;
        this.maxDistance = 10;
        this.spherical = new THREE.Spherical();
        this.sphericalDelta = new THREE.Spherical();
        this.scale = 1;
        this._isDragging = false;
        this._prevX = 0;
        this._prevY = 0;

        const offset = new THREE.Vector3();
        offset.copy(camera.position).sub(this.target);
        this.spherical.setFromVector3(offset);

        dom.addEventListener('mousedown', (e) => {
          this._isDragging = true;
          this._prevX = e.clientX;
          this._prevY = e.clientY;
        });
        dom.addEventListener('mousemove', (e) => {
          if (!this._isDragging) return;
          const dx = (e.clientX - this._prevX) * 0.005;
          const dy = (e.clientY - this._prevY) * 0.005;
          this.sphericalDelta.theta -= dx;
          this.sphericalDelta.phi -= dy;
          this._prevX = e.clientX;
          this._prevY = e.clientY;
        });
        dom.addEventListener('mouseup', () => { this._isDragging = false; });
        dom.addEventListener('wheel', (e) => {
          e.preventDefault();
          this.scale *= (e.deltaY > 0 ? 1.05 : 0.95);
        }, { passive: false });
      }
      update() {
        this.spherical.theta += this.sphericalDelta.theta * this.dampingFactor;
        this.spherical.phi += this.sphericalDelta.phi * this.dampingFactor;
        this.sphericalDelta.theta *= (1 - this.dampingFactor);
        this.sphericalDelta.phi *= (1 - this.dampingFactor);
        this.spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, this.spherical.phi));
        this.spherical.radius = Math.max(this.minDistance, Math.min(this.maxDistance, this.spherical.radius * this.scale));
        this.scale = 1;
        const offset = new THREE.Vector3().setFromSpherical(this.spherical);
        this.camera.position.copy(this.target).add(offset);
        this.camera.lookAt(this.target);
      }
    }

    window.addEventListener('load', function() {

    // ─── Scene ─────────────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a1a);
    scene.fog = new THREE.Fog(0x0a0a1a, 5, 15);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new SimpleOrbit(camera, renderer.domElement);
    controls.target.set(0, 0, 0);

    // ─── Lighting ──────────────────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0x222244, 2));
    const mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
    mainLight.position.set(5, 10, 5);
    scene.add(mainLight);
    const protonLight = new THREE.PointLight(0xff4400, 3, 5);
    scene.add(protonLight);
    const bubbleLight = new THREE.PointLight(0x00ccff, 2, 4);
    bubbleLight.position.set(0, 1, 0);
    scene.add(bubbleLight);

    // ─── Colors ────────────────────────────────────────────────────────────────
    const C = {
      proton: 0xff4400, bubble: 0x00ccff, bubbleBright: 0x00ffff,
      track: 0x00aaff, trackPurple: 0x9933ff, trackYellow: 0xffcc00,
      ghost: 0xffffff, frame: 0xcc9900,
    };

    // ─── Constants ─────────────────────────────────────────────────────────────
    const SPHERE_R = 2.0;
    const BALL_R = 0.07;
    const TRACK_H = 0.04; // rail height
    const GRAVITY = -4.0; // world-space gravity (always down)
    const DAMPING = 0.995;
    const RESTITUTION = 0.4; // bounce energy retention

    // ─── Sphere Group (tilts with mouse) ───────────────────────────────────────
    const sphereGroup = new THREE.Group();
    scene.add(sphereGroup);

    // Transparent shell
    sphereGroup.add(new THREE.Mesh(
      new THREE.SphereGeometry(SPHERE_R, 64, 64),
      new THREE.MeshPhysicalMaterial({
        color: 0xffffff, transparent: true, opacity: 0.06,
        roughness: 0.1, metalness: 0.1, side: THREE.DoubleSide,
      })
    ));

    // Gold frame
    function makeRing(radius, tubeR, color) {
      return new THREE.Mesh(
        new THREE.TorusGeometry(radius, tubeR, 16, 100),
        new THREE.MeshStandardMaterial({ color, metalness: 0.8, roughness: 0.3 })
      );
    }
    sphereGroup.add(makeRing(SPHERE_R, 0.04, C.frame));
    for (let i = 0; i < 3; i++) {
      const r = SPHERE_R * (0.3 + i * 0.2);
      const cap = makeRing(r, 0.03, C.frame);
      cap.position.y = SPHERE_R * 0.8 - i * SPHERE_R * 0.3;
      cap.rotation.x = Math.PI / 2;
      sphereGroup.add(cap);
      const cap2 = makeRing(r, 0.03, C.frame);
      cap2.position.y = -SPHERE_R * 0.8 + i * SPHERE_R * 0.3;
      cap2.rotation.x = Math.PI / 2;
      sphereGroup.add(cap2);
    }

    // ─── Tracks (flat rails on sphere surface) ────────────────────────────────
    // Each track is a flat ribbon (not a tube) that the ball rolls on.
    // We store track segments as line segments for collision.
    const trackGroup = new THREE.Group();
    sphereGroup.add(trackGroup);
    let trackSegments = []; // array of { a: Vector3, b: Vector3, normal: Vector3 } for collision

    function createRail(points, color) {
      if (points.length < 2) return;
      const mat = new THREE.MeshStandardMaterial({
        color, emissive: color, emissiveIntensity: 0.4,
        metalness: 0.4, roughness: 0.4, side: THREE.DoubleSide,
      });

      // Build a flat ribbon mesh
      const positions = [];
      const indices = [];
      const segs = [];

      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        const r = SPHERE_R - 0.03;
        const pos = new THREE.Vector3(
          r * Math.sin(p.phi) * Math.cos(p.theta),
          r * Math.cos(p.phi),
          r * Math.sin(p.phi) * Math.sin(p.theta)
        );
        // Normal points inward (toward center)
        const normal = pos.clone().normalize().negate();
        // Tangent direction
        const tangent = i < points.length - 1
          ? points[i+1].phi !== p.phi || points[i+1].theta !== p.theta
            ? new THREE.Vector3(
                r * Math.sin(points[i+1].phi) * Math.cos(points[i+1].theta) - pos.x,
                r * Math.cos(points[i+1].phi) - pos.y,
                r * Math.sin(points[i+1].phi) * Math.sin(points[i+1].theta) - pos.z
              ).normalize()
            : new THREE.Vector3(1, 0, 0)
          : new THREE.Vector3(1, 0, 0);

        // Side vector (perpendicular to normal and tangent)
        const side = new THREE.Vector3().crossVectors(normal, tangent).normalize();
        const halfW = TRACK_H * 0.5;

        positions.push(pos.x - side.x * halfW, pos.y - side.y * halfW, pos.z - side.z * halfW);
        positions.push(pos.x + side.x * halfW, pos.y + side.y * halfW, pos.z + side.z * halfW);

        if (i > 0) {
          const base = (i - 1) * 2;
          indices.push(base, base + 1, i * 2);
          indices.push(base + 1, i * 2 + 1, i * 2);
        }

        // Store collision segment
        if (i > 0) {
          const prevR = SPHERE_R - 0.03;
          const prev = new THREE.Vector3(
            prevR * Math.sin(points[i-1].phi) * Math.cos(points[i-1].theta),
            prevR * Math.cos(points[i-1].phi),
            prevR * Math.sin(points[i-1].phi) * Math.sin(points[i-1].theta)
          );
          segs.push({ a: prev, b: pos, normal: normal });
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();

      const mesh = new THREE.Mesh(geo, mat);
      trackGroup.add(mesh);
      trackSegments.push(...segs);
    }

    function generateMaze(level) {
      // Clear old
      while (trackGroup.children.length > 0) {
        const child = trackGroup.children[0];
        trackGroup.remove(child);
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
      }
      trackSegments = [];

      const numRings = 4 + Math.min(level, 3);
      for (let ring = 0; ring < numRings; ring++) {
        const phi = (ring + 1) / (numRings + 1) * Math.PI;
        const segments = 3 + ring + Math.floor(Math.random() * 2);
        for (let seg = 0; seg < segments; seg++) {
          const startTheta = (seg / segments) * Math.PI * 2 + Math.random() * 0.3;
          const endTheta = startTheta + (Math.PI * 2 / segments) * (0.5 + Math.random() * 0.3);
          const points = [];
          const steps = 15;
          for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            points.push({ phi, theta: startTheta + t * (endTheta - startTheta) });
          }
          const colors = [C.track, C.trackPurple, C.trackYellow, C.bubble];
          createRail(points, colors[ring % colors.length]);
        }
        // Bridge to next ring
        if (ring < numRings - 1) {
          const nextPhi = (ring + 2) / (numRings + 1) * Math.PI;
          const bridgeTheta = Math.random() * Math.PI * 2;
          const bridgePoints = [];
          for (let i = 0; i <= 8; i++) {
            const t = i / 8;
            bridgePoints.push({ phi: phi + t * (nextPhi - phi), theta: bridgeTheta });
          }
          createRail(bridgePoints, C.trackYellow);
        }
      }
      // Spiral
      const spiralPoints = [];
      const spiralTurns = 3;
      for (let i = 0; i <= spiralTurns * 20; i++) {
        const t = i / (spiralTurns * 20);
        spiralPoints.push({ phi: t * Math.PI * 0.3 + 0.1, theta: t * spiralTurns * Math.PI * 2 });
      }
      createRail(spiralPoints, C.proton);
    }

    generateMaze(0);

    // ─── Goal ──────────────────────────────────────────────────────────────────
    const goal = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 16, 16),
      new THREE.MeshStandardMaterial({ color: C.proton, emissive: C.proton, emissiveIntensity: 1.0 })
    );
    goal.position.set(0, SPHERE_R - 0.1, 0);
    sphereGroup.add(goal);

    const goalGlow = new THREE.Mesh(
      new THREE.SphereGeometry(0.2, 16, 16),
      new THREE.MeshBasicMaterial({ color: C.proton, transparent: true, opacity: 0.3 })
    );
    goalGlow.position.copy(goal.position);
    sphereGroup.add(goalGlow);

    // ─── Ball ──────────────────────────────────────────────────────────────────
    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(BALL_R, 32, 32),
      new THREE.MeshStandardMaterial({
        color: C.proton, emissive: C.proton, emissiveIntensity: 0.5,
        metalness: 0.5, roughness: 0.3,
      })
    );
    scene.add(ball);

    const ballGlow = new THREE.Mesh(
      new THREE.SphereGeometry(BALL_R * 2, 16, 16),
      new THREE.MeshBasicMaterial({ color: C.bubbleBright, transparent: true, opacity: 0.2 })
    );
    scene.add(ballGlow);

    // ─── Ball Physics (proper 3D) ──────────────────────────────────────────────
    // Ball position and velocity are in WORLD space.
    // The sphere tilts (rotates) based on mouse. Tracks are children of sphereGroup.
    // Gravity always pulls down in world space (-Y).
    // Ball bounces off the inner sphere surface and slides on tracks.

    const ballState = {
      pos: new THREE.Vector3(0, SPHERE_R * 0.7, 0), // start near top
      vel: new THREE.Vector3(0, 0, 0),
      score: 0,
      level: 0,
      won: false,
    };
    window.__debug = { get ballState() { return ballState; }, get trackSegments() { return trackSegments; }, get sphereGroup() { return sphereGroup; } };

    // Sphere tilt state
    const tiltState = { x: 0, y: 0 };

    function getWorldPos(localPos) {
      return localPos.applyMatrix4(sphereGroup.matrixWorld);
    }

    function getLocalPos(worldPos) {
      const inv = new THREE.Matrix4().copy(sphereGroup.matrixWorld).invert();
      return worldPos.clone().applyMatrix4(inv);
    }

    function updateBall(dt) {
      if (ballState.won) return;

      // Gravity (world space, always down)
      ballState.vel.y += GRAVITY * dt;

      // Damping
      ballState.vel.multiplyScalar(DAMPING);

      // Integrate
      ballState.pos.add(ballState.vel.clone().multiplyScalar(dt));

      // ── Collision with inner sphere surface ──
      // Ball must stay INSIDE the sphere. If it goes past the inner surface,
      // push it back and reflect velocity.
      const invMatrix = new THREE.Matrix4().copy(sphereGroup.matrixWorld).invert();
      const localPos = ballState.pos.clone().applyMatrix4(invMatrix);
      const localDist = localPos.length();
      const maxDist = SPHERE_R - BALL_R;

      if (localDist > maxDist) {
        // Ball hit the inner sphere wall — push back and bounce
        const localNormal = localPos.clone().normalize(); // points from center to ball
        const worldNormal = localNormal.clone().transformDirection(sphereGroup.matrixWorld);

        // Project ball back onto inner surface
        ballState.pos.copy(
          ballState.pos.clone().sub(worldNormal.clone().multiplyScalar(localDist - maxDist))
        );

        // Reflect velocity (bounce off inner wall)
        const velDotN = ballState.vel.dot(worldNormal);
        if (velDotN > 0) {
          ballState.vel.sub(worldNormal.clone().multiplyScalar(velDotN * (1 + RESTITUTION)));
          ballState.vel.multiplyScalar(0.95); // friction
        }
      }

      // ── Collision with track rails ──
      for (let si = 0; si < trackSegments.length; si++) {
        const seg = trackSegments[si];
        const aW = seg.a.clone().applyMatrix4(sphereGroup.matrixWorld);
        const bW = seg.b.clone().applyMatrix4(sphereGroup.matrixWorld);
        const normalW = seg.normal.clone().transformDirection(sphereGroup.matrixWorld);

        // Closest point on segment to ball
        const ab = bW.clone().sub(aW);
        const ap = ballState.pos.clone().sub(aW);
        const t = Math.max(0, Math.min(1, ap.dot(ab) / ab.lengthSq()));
        const closest = aW.clone().add(ab.clone().multiplyScalar(t));
        const dist = ballState.pos.distanceTo(closest);

        const collisionDist = TRACK_H * 0.5 + BALL_R;
        if (dist < collisionDist) {
          // Ball is on the rail — push to rail surface and slide
          const toBall = ballState.pos.clone().sub(closest);
          if (toBall.lengthSq() < 0.0001) continue;
          toBall.normalize();

          ballState.pos.copy(closest.clone().add(toBall.multiplyScalar(collisionDist)));

          // Bounce: remove velocity component into rail
          const velDotN = ballState.vel.dot(toBall);
          if (velDotN < 0) {
            ballState.vel.sub(toBall.clone().multiplyScalar(velDotN * (1 + RESTITUTION * 0.5)));
            ballState.vel.multiplyScalar(0.97); // friction on rail
          }
        }
      }

      // ── Goal check (world space) ──
      const goalWorld = goal.position.clone().applyMatrix4(sphereGroup.matrixWorld);
      if (ballState.pos.distanceTo(goalWorld) < 0.15) {
        ballState.won = true;
        ballState.score += 500;
        spawnParticles(ballState.pos, C.proton, 30);
      }

      // ── Ball fell way below (safety) ──
      if (ballState.pos.y < -SPHERE_R * 2) {
        ballState.score = Math.max(0, ballState.score - 50);
        ballState.pos.set(0, SPHERE_R * 0.7, 0);
        ballState.vel.set(0, 0, 0);
        spawnParticles(ballState.pos, C.bubble, 15);
      }

      // Update mesh
      ball.position.copy(ballState.pos);
      ballGlow.position.copy(ballState.pos);
    }

    // ─── Ghosts ────────────────────────────────────────────────────────────────
    const ghosts = [];
    const ghostGroup = new THREE.Group();
    sphereGroup.add(ghostGroup);

    function createGhost() {
      const group = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({
        color: C.ghost, transparent: true, opacity: 0.8,
        emissive: 0xaaaaff, emissiveIntensity: 0.3,
      });
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(0.15, 16, 16, 0, Math.PI * 2, 0, Math.PI * 0.6),
        bodyMat
      );
      group.add(body);
      const bottom = new THREE.Mesh(
        new THREE.CylinderGeometry(0.15, 0.12, 0.1, 16), bodyMat.clone()
      );
      bottom.position.y = -0.1;
      group.add(bottom);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), eyeMat);
      eye1.position.set(-0.05, 0.02, 0.12);
      group.add(eye1);
      const eye2 = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), eyeMat);
      eye2.position.set(0.05, 0.02, 0.12);
      group.add(eye2);
      const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 8), eyeMat);
      mouth.position.set(0, -0.05, 0.13);
      group.add(mouth);
      group.add(new THREE.PointLight(0xaaaaff, 0.5, 1));

      const phi = Math.random() * Math.PI;
      const theta = Math.random() * Math.PI * 2;
      const r = SPHERE_R * (0.5 + Math.random() * 0.3);
      group.position.set(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi),
        r * Math.sin(phi) * Math.sin(theta)
      );
      group.scale.setScalar(0.8 + Math.random() * 0.4);

      const ghost = {
        mesh: group, phi, theta, r,
        vPhi: (Math.random() - 0.5) * 0.5,
        vTheta: (Math.random() - 0.5) * 0.5,
        phase: Math.random() * Math.PI * 2,
      };
      ghostGroup.add(group);
      ghosts.push(ghost);
    }

    for (let i = 0; i < 3; i++) createGhost();

    function updateGhosts(dt, time) {
      for (const g of ghosts) {
        g.phase += dt * 2;
        g.vPhi += (Math.random() - 0.5) * 0.1 * dt;
        g.vTheta += (Math.random() - 0.5) * 0.1 * dt;
        g.vPhi *= 0.98;
        g.vTheta *= 0.98;
        g.phi += g.vPhi * dt;
        g.theta += g.vTheta * dt;
        if (g.phi < 0.3) g.vPhi = Math.abs(g.vPhi);
        if (g.phi > Math.PI - 0.3) g.vPhi = -Math.abs(g.vPhi);

        g.mesh.position.set(
          g.r * Math.sin(g.phi) * Math.cos(g.theta),
          g.r * Math.cos(g.phi),
          g.r * Math.sin(g.phi) * Math.sin(g.theta)
        );
        g.mesh.rotation.z = Math.sin(time * 3 + g.phase) * 0.2;

        // Ghost-ball collision (world space)
        const ghostWorld = g.mesh.position.clone().applyMatrix4(sphereGroup.matrixWorld);
        if (ballState.pos.distanceTo(ghostWorld) < 0.2) {
          ballState.score = Math.max(0, ballState.score - 100);
          ballState.pos.set(0, SPHERE_R * 0.7, 0);
          ballState.vel.set(0, 0, 0);
          spawnParticles(ballState.pos, C.ghost, 20);
          g.phi = Math.random() * Math.PI;
          g.theta = Math.random() * Math.PI * 2;
        }
      }
    }

    // ─── Bubbles ───────────────────────────────────────────────────────────────
    const bubbles = [];
    const bubbleGeo = new THREE.SphereGeometry(0.05, 8, 8);

    function spawnBubble() {
      const mesh = new THREE.Mesh(bubbleGeo, new THREE.MeshBasicMaterial({
        color: C.bubbleBright, transparent: true, opacity: 0.4,
      }));
      const phi = Math.random() * Math.PI;
      const theta = Math.random() * Math.PI * 2;
      const r = SPHERE_R * (0.3 + Math.random() * 0.5);
      mesh.position.set(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi),
        r * Math.sin(phi) * Math.sin(theta)
      );
      mesh.scale.setScalar(0.5 + Math.random() * 1.5);
      sphereGroup.add(mesh);
      bubbles.push({ mesh, life: 1.0, decay: 0.002 + Math.random() * 0.005 });
    }

    function updateBubbles(dt) {
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.life -= b.decay;
        b.mesh.material.opacity = b.life * 0.4;
        b.mesh.position.y += dt * 0.1;
        if (b.life <= 0) {
          sphereGroup.remove(b.mesh);
          b.mesh.material.dispose();
          bubbles.splice(i, 1);
        }
      }
      if (Math.random() > 0.95 && bubbles.length < 20) spawnBubble();
    }

    // ─── Particles ─────────────────────────────────────────────────────────────
    const particles = [];
    const particleGeo = new THREE.SphereGeometry(0.03, 8, 8);

    function spawnParticles(pos, color, count) {
      for (let i = 0; i < count; i++) {
        const mesh = new THREE.Mesh(particleGeo, new THREE.MeshBasicMaterial({
          color, transparent: true, opacity: 1.0,
        }));
        mesh.position.copy(pos);
        const vel = new THREE.Vector3(
          (Math.random() - 0.5) * 2,
          (Math.random() - 0.5) * 2,
          (Math.random() - 0.5) * 2
        );
        scene.add(mesh);
        particles.push({ mesh, vel, life: 1.0, decay: 0.02 + Math.random() * 0.03 });
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= p.decay;
        p.vel.multiplyScalar(0.98);
        p.vel.y += GRAVITY * 0.3 * dt;
        p.mesh.position.add(p.vel.clone().multiplyScalar(dt));
        p.mesh.material.opacity = p.life;
        if (p.life <= 0) {
          scene.remove(p.mesh);
          p.mesh.material.dispose();
          particles.splice(i, 1);
        }
      }
    }

    // ─── Input ─────────────────────────────────────────────────────────────────
    let mouseX = 0.5, mouseY = 0.5;
    document.addEventListener('mousemove', function(e) {
      mouseX = e.clientX / window.innerWidth;
      mouseY = e.clientY / window.innerHeight;
    });

    document.addEventListener('click', function() {
      if (ballState.won) {
        ballState.level++;
        ballState.won = false;
        ballState.score += 100;
        generateMaze(ballState.level);
        ballState.pos.set(0, SPHERE_R * 0.7, 0);
        ballState.vel.set(0, 0, 0);
        updateUI();
      }
    });

    // ─── UI ────────────────────────────────────────────────────────────────────
    const uiDiv = document.getElementById('ui');
    function updateUI() {
      uiDiv.innerHTML =
        'SCORE: ' + ballState.score + '<br>' +
        'LEVEL: ' + (ballState.level + 1) + '<br>' +
        'GHOSTS: ' + ghosts.length +
        (ballState.won ? '<br><span style="color:#ff4400;font-size:24px">LEVEL COMPLETE! Click to continue</span>' : '');
    }

    // ─── Animation Loop ────────────────────────────────────────────────────────
    const clock = new THREE.Clock();
    let time = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.033);
      time += dt;

      // Tilt sphere based on mouse (smooth)
      const targetTiltX = (mouseY - 0.5) * 1.2; // tilt around X (left/right)
      const targetTiltY = (mouseX - 0.5) * 1.2; // tilt around Y (up/down)
      tiltState.x += (targetTiltX - tiltState.x) * 0.05;
      tiltState.y += (targetTiltY - tiltState.y) * 0.05;
      sphereGroup.rotation.x = tiltState.x;
      sphereGroup.rotation.y = tiltState.y;

      // Update matrix so world/local transforms are current
      sphereGroup.updateMatrixWorld();

      updateBall(dt);
      updateGhosts(dt, time);
      updateBubbles(dt);
      updateParticles(dt);

      // Animate goal
      const pulse = 1 + Math.sin(time * 3) * 0.2;
      goal.scale.setScalar(pulse);
      goalGlow.scale.setScalar(pulse * 1.5);
      protonLight.intensity = 2 + Math.sin(time * 3);
      ballGlow.scale.setScalar(1 + Math.sin(time * 5) * 0.1);

      // Ghost flicker
      for (const g of ghosts) {
        for (const child of g.mesh.children) {
          if (child.isPointLight) {
            child.intensity = 0.3 + Math.sin(time * 5 + g.phase) * 0.2;
            break;
          }
        }
      }

      controls.update();
      updateUI();
      renderer.render(scene, camera);
    }

    // ─── Resize ────────────────────────────────────────────────────────────────
    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateUI();
    animate();
    console.log('Perplexus: Ghostbusters Edition loaded!');

    }); // end load handler
  </script>
</body>
</html>
