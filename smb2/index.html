<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros - World 1-1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #5c94fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            border: 3px solid #000;
            image-rendering: pixelated;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game"></canvas>
    </div>
    <script src="js/input.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/entity.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/sfx.js"></script>
    <script src="js/mario.js"></script>
    <script src="js/goomba.js"></script>
    <script src="js/koopa.js"></script>
    <script src="js/mushroom.js"></script>
    <script src="js/block.js"></script>
    <script src="js/level-data.js"></script>
    <script src="js/tilemap.js"></script>
    <script src="js/level.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
