<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="background:#000">
<canvas id="game" width="960" height="540"></canvas>
<pre id="state-check" style="color:#888;position:fixed;bottom:0;left:0;font:12px monospace">smoke-test running…</pre>
<script type="module">
import './js/main.js';
import { S, getState, tryTransition } from './js/state.js';
import { Home } from './js/screens.js';

const results = [];
let failures = 0;

// Real key press: down + up with a frame gap so the input engine's
// physical-state map sees a clean press (keydown alone leaves it half-armed).
function key(code) {
  window.dispatchEvent(new KeyboardEvent('keydown', { code, bubbles: true }));
  setTimeout(() => window.dispatchEvent(new KeyboardEvent('keyup', { code, bubbles: true })), 60);
}
async function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
// Press a key, let the fixed-timestep loop consume it, then record state.
async function step(label, expect, code) {
  if (code) { key(code); await wait(200); }
  const got = getState();
  const ok = expect == null || got === expect;
  if (!ok) failures++;
  results.push(`${label}=${got}${ok ? '' : ' EXPECTED ' + expect}`);
}

(async () => {
  // Wait for the game loop to be alive.
  for (let i = 0; i < 30 && !document.getElementById('game'); i++) await wait(100);
  await wait(500);

  // HOME intro is a parallax card sequence; each confirm skips ONE card.
  // Fast-forward it directly instead of pressing Enter five times.
  Home.parallaxOffset = 9.5;   // jump to final scene
  await step('home', S.HOME);
  await step('prompt-shown', S.HOME, 'Enter');   // first press shows prompt
  await step('select', S.SELECT, 'Enter');       // second press transitions

  // SELECT → PLAY
  await step('play', S.PLAY, 'Enter');

  // PAUSE → retry (R): expect back in PLAY
  await step('paused', S.PAUSE, 'Escape');
  await step('pause-retry', S.PLAY, 'KeyR');

  // OVER flow: force transition (killing the boss is not scriptable here),
  // then exercise the OVER screen keys.
  const U = await import('./js/systems/update.js');
  const hero = U.getHero();
  if (getState() === S.PLAY) tryTransition(S.OVER);
  await step('over', S.OVER);
  hero.coins = 2000; hero.continuesUsed = 0;
  await step('after-continue', S.PLAY, 'KeyC');

  // Back to OVER and quit to HOME
  if (getState() === S.PLAY) tryTransition(S.OVER);
  await step('over2', S.OVER);
  await step('after-quit', S.HOME, 'KeyQ');

  // WIN flow
  await step('select2', S.SELECT, 'Enter');
  await step('play2', S.PLAY, 'Enter');
  tryTransition(S.WIN);
  await step('win', S.WIN);
  await step('after-playagain', S.SELECT, 'Enter');

  const el = document.getElementById('state-check');
  el.textContent = (failures === 0 ? 'SMOKE PASS  ' : `SMOKE FAIL (${failures})  `) + results.join(' | ');
  el.style.color = failures === 0 ? '#2ecc71' : '#e74c3c';
})();
</script></body></html>
