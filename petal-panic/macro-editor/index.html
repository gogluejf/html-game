<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MACRO EDITOR</title>
<link rel="stylesheet" href="css/editor.css">
<style>
  /* macro-editor specific additions (layout reuses editor.css) */
  #newBtn{width:100%;margin-bottom:12px;justify-content:center;font-weight:bold;}
  .diff-group{color:var(--yel);font-size:12px;margin:10px 0 3px;letter-spacing:1px;text-transform:uppercase;}
  .ent .orient{color:var(--faint);font-size:11px;margin-left:6px;}
  .ent .orient.v{color:var(--pur);}
  #macroMeta{font-size:12px;color:var(--dim);line-height:1.7;margin-top:4px;}
  #macroMeta b{color:var(--txt);}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>Macro Editor</h1>
    <div class="sub" id="projectLabel"></div>
    <button class="tbtn" id="newBtn" title="create a new macro (not available yet)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>NEW MACRO</button>
    <div id="tree"></div>
  </div>
  <div id="mid">
    <div id="toolbar" class="booting">
      <div class="tgroup edit-tools">
        <span class="gtitle">Tools</span>
        <button class="tbtn" id="toolNone" title="select, move, and resize existing geometry (V)">SELECT</button>
        <button class="tbtn" id="toolBlock" title="drag a block rectangle (B)">BLOCK</button>
        <button class="tbtn" id="toolPlatform" title="drag a horizontal platform (P)">PLATFORM</button>
        <button class="tbtn slot-enemy" id="toolSlotEnemy" title="place enemy slot (1)">ENEMY</button>
        <button class="tbtn slot-barrel" id="toolSlotBarrel" title="place barrel slot (2)">BARREL</button>
        <button class="tbtn slot-powerup" id="toolSlotPowerup" title="place power-up slot (3)">POWER-UP</button>
        <button class="tbtn" id="toolErase" title="erase an object or slot (E)">ERASE</button>
      </div>
      <div class="tgroup">
        <span class="gtitle">Display</span>
        <button class="tbtn tog on" id="tglGrid" title="show/hide unit grid (G)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>GRID</button>
        <button class="tbtn tog on" id="tglSlots" title="show/hide placement slots (S)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="12" r="2.5"/><circle cx="12" cy="12" r="2.5"/><circle cx="17" cy="12" r="2.5"/></svg>SLOTS</button>
        <button class="tbtn tog on" id="tglLabels" title="show/hide block/platform labels (L)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h10M4 17h13"/></svg>LABELS</button>
        <button class="tbtn tog on" id="tglZone" title="show/hide the area bounding box + entry/exit (Z)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="1" stroke-dasharray="3 2"/><path d="M8 9l4 4M12 9l-4 4"/><path d="M16 9v6M16 9h3l-1.5 1.5L19 12h-3"/></svg>ZONE</button>
      </div>
      <div style="position:relative;display:inline-flex;">
        <button class="tbtn" id="resetBtn" title="reset options">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>RESET</button>
        <div id="resetMenu" style="display:none;position:absolute;top:100%;left:0;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;z-index:10;min-width:160px;white-space:nowrap;">
          <div class="reset-opt" data-scope="discard" style="padding:6px 10px;cursor:pointer;border-radius:6px;font-size:13px;color:#ffb454;">Discard Draft…</div>
        </div>
      </div>
      <span id="saveIndicator" style="font-size:10px;color:var(--grn);opacity:0;transition:opacity .3s;margin-left:auto;margin-right:8px;">✓</span>
      <div class="tgroup">
        <button class="tbtn" id="undoBtn" title="undo last transformation (ctrl+Z)" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 7L4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 0 10h-1"/></svg></button>
        <button class="tbtn" id="redoBtn" title="redo (ctrl+Y / ctrl+shift+Z)" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 7l5 5-5 5"/><path d="M20 12H9a5 5 0 0 0 0 10h1"/></svg></button>
        <button class="tbtn" id="saveBtn" title="save macro to disk (ctrl+S)" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>SAVE</button>
      </div>
    </div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="validationHint"></div>
    </div>
    <div id="transport">
      <div id="zoombox" title="zoom: mouse wheel / ctrl+- / ctrl++">
        <button id="zoomOut" title="zoom out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M20 20l-4-4"/></svg></button>
        <div id="zoomval">100%</div>
        <button id="zoomIn" title="zoom in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M20 20l-4-4"/></svg></button>
      </div>
      <button id="fitBtn" class="tbtn" title="fit macro to view (ctrl+0)">FIT</button>
      <div id="finfo"></div>
    </div>
  </div>
  <div id="panel">
    <div class="sprite-title" id="p_stitle">&mdash;</div>
    <div id="macroMeta"></div>
    <h2><span><span class="swatch" style="background:var(--acc)"></span>Overview</span></h2>
    <div class="row"><span>Orientation</span><span class="ro" id="p_orient">&mdash;</span></div>
    <div class="row"><span>Difficulty</span><span class="ro" id="p_diff">&mdash;</span></div>
    <div class="row"><span>Blocks</span><span class="ro" id="p_blocks">&mdash;</span></div>
    <div class="row"><span>Platforms</span><span class="ro" id="p_plats">&mdash;</span></div>
    <div class="row"><span>Slots</span><span class="ro" id="p_slots">&mdash;</span></div>
    <h2><span><span class="swatch" style="background:var(--yel)"></span>Unit Grid</span></h2>
    <div class="row"><span>Cell width</span><span class="ro" id="p_cellw">&mdash;</span></div>
    <div class="row"><span>Cell height</span><span class="ro" id="p_cellh">&mdash;</span></div>
    <div class="row"><span>Platform draw H</span><span class="ro" id="p_plath">&mdash;</span></div>
  </div>
</div>
<dialog id="confirmDialog">
  <div class="cd-body">
    <div class="cd-title" id="cdTitle">⚠ Confirm</div>
    <div class="cd-msg" id="cdMsg"></div>
  </div>
  <div class="cd-actions">
    <button class="cd-btn" id="cdCancel">Cancel</button>
    <button class="cd-btn danger" id="cdYes">Confirm</button>
  </div>
</dialog>
<script type="module" src="js/main.js?v=12"></script>
<div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 20px;font-size:13px;color:var(--txt);opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;"></div>
</body>
</html>
