# Jester | petal-panic/docs/entities/jester.yaml
jester:
  id: jester
  name: "Jester"
  w: 36
  h: 48
  aggro_radius: 300
  stats:
    weight: 1
    speed: 120         # px/s
    attack: 15
    defense: 2
    stamina: 40        # = maxHp
    mjump: 0
    melee: true
    projectile: false
    fly: false
  coin_drop: { min: 1, max: 3, chance: 1.0, types: { bronze: 1 } }

  # --- whip attack ---
  whip_range: 60              # px; distance to trigger whip
  whip_duration: 0.4          # seconds total whip anim
  whip_active_frac: [0.25, 0.75]  # fraction where hitbox is live
  whip_cooldown: 1.5          # seconds between whips
  whip_hitbox: { ox: 15, oy: -10, bw: 35, bh: 30 }
  aggro_release_mult: 1.5     # deaggro at aggroRadius * this

  # --- knockback (docs/architecture/knockback.md) ---
  # v1 scope: hero→enemy knockback only, from the three committed hero attacks.
  # The jester's whip is an ENEMY attack on the hero — it carries NO knockback
  # setting; enemy attacks shove the hero via the hero-side KNOCKBACK_PROFILES
  # (source-keyed, js/hero.js), not per-attack data. The jester's own body
  # contact uses the base enemy_knockback from base/enemy.yaml.
