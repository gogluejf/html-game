# Jack-O-Lantern | js/jackolantern.js
jack_o_lantern:
  id: jackolantern
  name: "Jack-O-Lantern"
  w: 40
  h: 40
  aggro_radius: 400
  stats:
    weight: 1
    speed: 150         # px/s while rolling
    attack: 22
    defense: 0
    stamina: 30        # = maxHp
    melee: false
    projectile: false
    fly: false
  coin_drop: { min: 1, max: 2, chance: 1.0, types: { bronze: 1 } }

  # --- rolling bomb ---
  roll_speed: 150           # px/s toward hero
  detonate_range: 80        # px; proximity triggers detonation
  fuse_time: 3              # seconds; auto-detonate after this
  launch_time: 0.4          # seconds telegraph before exploding
  explode_time: 0.3         # seconds explosion flash lasts
  spin_speed: 6             # rad/s visual spin while rolling
  aggro_release_mult: 1.5

  # --- explosion (docs/architecture/explosion.md) ---
  # Generic entity property: any entity with .explosion detonates via
  # resolveExplosion() on trigger. Alignment 'foe' means it hurts the hero
  # but spares other enemies. Knockback is radial (shoves victims outward).
  explosion:
    radius: 80              # px AoE reach
    damage: 22              # HP drain per target
    alignment: foe          # 'foe' | 'ally' | 'neutral' (§2)
    knockback:
      base: 300             # px/s radial shove strength
      scale_by_speed: 0     # no motion term for explosions
      hitstun: 0.25         # seconds victim AI freezes
      i_frames: 0.40        # protection window (seconds)
      dir_mode: radial      # push away from blast center (§4)
      pop: 50               # fixed upward launch px/s (§5)
