# Petal Panic — GameObj (destructible solid) | js/object.js
game_obj:
  # --- inherited from Entity ---

  type: "explosiveBarrel"  # def.id
  def: {}                  # raw object definition
  hp: 60                   # current HP
  maxHp: 60
  explosion: null          # generic explosion config (docs/architecture/explosion.md); null = no blast
  coinDrop: null           # unified drop config (same shape as Enemy), null = no drop
  hitFlash: 0              # white flash timer when struck
  destroyed: false         # latched once HP hits 0

  # --- explosion property (docs/architecture/explosion.md) ---
  # Any entity (GameObj, Enemy, projectile) can carry an .explosion object.
  # When the entity detonates (barrel: HP→0; enemy: AI trigger), the engine
  # calls resolveExplosion() with this config. No per-type special-casing.
  #   radius      px AoE reach
  #   damage      HP drain per valid target
  #   alignment   'foe' | 'ally' | 'neutral' — decides who is hurt (§2)
  #   knockback   KnockbackSetting with dirMode 'radial' (§4, knockback.md §7)
  #
  # explosive is a derived getter: get explosive() { return !!this.explosion }
