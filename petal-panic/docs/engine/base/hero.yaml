# Petal Panic — Hero | js/hero.js + js/heroDefs.js
hero:
  # --- inherited from Entity (x,y,w,h,vx,vy,gravity,facing,mirrorX,mirrorY,rotation,scale,anim,layer,box,alive,intangible,timers,ttl,radius) ---

  heroDef: {}       # raw def from heroDefs.js
  stats:            # copy of heroDef.stats
    weight: 1
    speed: 250      # px/s
    attack: 10
    defense: 2
    stamina: 100    # = maxEnergy
    jump: 500       # px/s impulse
    projectile_freq: 8   # shots/sec
    special_freq: 2      # seconds
    special: saw    # 'saw' | 'bomb'

  # --- resources / combat ---
  energy: 100       # current HP (drained by damage())
  maxEnergy: 100
  shield: 0         # absorbs damage before energy
  ammo: 200         # thorn bullets
  specialAmmo: 0    # saw/bomb ammo
  coins: 0
  lives: 3
  checkpoint: { x: 0, y: 0 }

  # --- death / respawn / continue ---
  dying: false
  deathTimer: 0     # seconds elapsed in death anim
  DEATH_DURATION: 1.5
  continuesUsed: 0
  maxContinues: 3

  # --- movement state ---
  grounded: false
  crouching: false
  sliding: false
  jumpsUsed: 0      # 0=ground, 1=first jump, 2=double jump
  MAX_JUMPS: 2

  # --- melee swing ---
  meleeCooldown: 0  # seconds until next swing allowed
  meleeActive: false
  meleeFrame: 0     # float frame position
  MELEE_TOTAL_FRAMES: 5
  MELEE_ACTIVE_FRAME: 3
  MELEE_FRAME_DURATION: 0.08  # 0.4s total swing
  meleeHitbox: { ox: 20, oy: -10, bw: 40, bh: 40 }

  # --- super move (B key) ---
  superMeter: 0     # 0..100, charges at 20/s (5s to full)
  SUPER_MAX: 100
  SUPER_CHARGE_RATE: 20
  superActive: false    # true while the dash is playing
  superTimer: 0         # seconds remaining in the dash
  SUPER_DUR: 0.6        # total dash duration
  SUPER_SPEED: 900      # initial px/s burst
  SUPER_DECEL: 1800     # px/s² deceleration during glide
  superHitbox: { ox: 20, oy: -h/2, bw: 16, bh: h }  # thin, full body height, in front
  _prevAnim: null       # saved anim to restore after super ends
  _superHitSet: null    # targets already hit this dash

  # --- committed-attack knockback (docs/architecture/knockback.md §11) ---
  # Knockback is DATA on the attack's hitbox (hb.knockback); the core wiring
  # reads it at impact and routes to applyKnockback(). Fields match
  # KnockbackSetting in js/knockback.js field-for-field. v1 scope: only these
  # three committed attacks carry a knockback setting — normal melee and
  # thorn/special projectiles deal damage without shoving.
  #   base           px/s inherent heft (§2)
  #   scale_by_speed multiplier on head-on relative velocity (§2 motion term)
  #   hitstun        stun window in seconds — victim ai() skipped, physics run (§6)
  #   pop            fixed upward launch px/s added on top of the directional
  #                  impulse; hard hits pop the victim off the ground so it
  #                  falls back under existing gravity (§5). 0/absent = none.
  #   dir_mode       'fromAttacker' | 'alongVelocity' | 'radial' (§4)
  sweep_knockback:     # Balthazar specialMelee — forward lunge; shove ALONG the lunge
    base: 320
    scale_by_speed: 0.4
    hitstun: 0.28
    pop: 40
    dir_mode: along_velocity
  cartwheel_knockback: # Scarlet specialMelee — retreating roll; shove AWAY from the hero
    base: 360
    scale_by_speed: 0.4
    hitstun: 0.30
    pop: 50
    dir_mode: from_attacker
  supermove_knockback: # shared by both heroes — strongest launch, longest stun, visible loft
    base: 360
    scale_by_speed: 0.3
    hitstun: 0.30
    pop: 90
    dir_mode: along_velocity
  # Note: explosion knockback is NOT declared here — it is carried on the
  # explosion subject itself (knockback.md §7: "An explosion → the explosion"),
  # blowing victims radially outward with distance falloff.

  # --- collision boxes ---
  standBox: { ox: 0, oy: 0, bw: w, bh: h }
  crouchBox: { ox: 0, oy: h*0.4, bw: w, bh: h*0.6 }
  box: standBox     # active ref, swapped on crouch

  # --- animation registry ---
  anims: {}         # { run, jump, attack, supermove, ... } attached by caller

  # --- internal feel timers ---
  _coyote: 0        # coyote grace (seconds remaining)
  _jumpBuffer: 0    # pre-land jump buffer (seconds remaining)
  _prevJumpHeld: false

  # --- unified timer labels used ---
  # inv          → invincibility frames (post-hit)
  # rapid        → rapid-fire window
  # rec          → hit-stun / recovery (input locked)
  # intangible   → intangible state expiry (super dash, god mode)
