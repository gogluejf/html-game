# Petal Panic — Enemy (base) | js/enemy.js
enemy:
  # --- inherited from Entity ---

  type: "jester"    # def.id string
  name: "Jester"    # display name
  def: {}           # raw enemy definition object
  isBoss: false     # true for boss enemies (Elephant); set via def.isBoss
  stats:            # copy of def.stats
    weight: 1
    speed: 120      # px/s
    attack: 15
    defense: 2
    stamina: 40     # = maxHp
    mjump: 0
    melee: true
    projectile: false
    fly: false
  hp: 40            # current HP (drained via damage())
  maxHp: 40
  coinDrop:         # unified drop config (same shape as GameObj)
    min: 1          # min coins to spawn
    max: 3          # max coins to spawn
    chance: 1.0     # probability of dropping (1 = always)
    types:          # weight per coin type (optional, defaults 70/25/5)
      bronze: 1
      silver: 0
      gold: 0

  # --- AI state ---
  aiState: idle     # 'idle' | 'walk' | 'chase' | 'attack' | 'dead'
  aggroRadius: 300  # px; also aliased to this.radius for debug circle
  hitFlash: 0       # seconds remaining on white flash

  # --- death pipeline ---
  deathDuration: 0.75  # total shrink+fade seconds
  fading: false        # true after half duration (render fades out)
  # deathTimer is a getter derived from timers.get('death')

  # --- body-contact knockback (§9, docs/architecture/knockback.md) ---
  # Carried on the enemy's own body so the contact handler can call
  # applyKnockback() with no layer-based branching. Regular enemies get the
  # lighter base; bosses declare a larger one so they read harder through mass
  # AND speed (the motion term picks up their velocity automatically).
  # Fields match KnockbackSetting in js/knockback.js field-for-field.
  body_knockback:
    base: 260           # px/s inherent heft when nothing is moving (§2)
    scale_by_speed: 1.0 # multiplier on head-on relative velocity (§2 motion term)
    hitstun: 0.25       # stun window in seconds — ai() skipped, physics run (§6)
    i_frames: 0.60      # protection window in seconds; 0/absent = none (§6)
    # dir_mode: 'fromAttacker' | 'alongVelocity' | 'radial' (§4) — informational;
    # the caller derives the normalized direction. Body contact pushes away from
    # the attacker, so this resolves to from_attacker at impact.
  # Boss override (isBoss): { base: 340, scale_by_speed: 1.0, hitstun: 0.30, i_frames: 0.70 }

  # --- explosion (docs/architecture/explosion.md) ---
  # Optional generic property: any enemy def can declare an .explosion object.
  # When the enemy detonates (e.g. Jack-O-Lantern sets .exploded = true), the
  # engine calls resolveExplosion() with this config. null/absent = no blast.
  # See entities/jack_o_lantern.yaml for a concrete example.
  explosion: null       # { radius, damage, alignment, knockback } or null
