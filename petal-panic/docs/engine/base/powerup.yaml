# Petal Panic — Powerup | js/powerup.js
powerup:
  # --- inherited from Entity ---

  powerType: "specialDrop"  # one of POWERUP_TYPES
  def: {}               # { label, color, duration?, apply() }
  collected: false      # latched on collect (prevents double-apply)
  bobOffset: 0          # radians; visual bob phase (random init)

  # --- effect definitions ---
  defs:
    invincibility:
      label: "Invincible!"
      duration: 5       # seconds
      effect: hero.invincibleTimer = max(current, 5)
    # Special drop (special-weapons.md): grants a RANDOM special weapon
    # (bomb / petal saw), shared by both heroes. Placement + auto-select are
    # owned by the hero's slot model (acquireSpecial).
    specialDrop:
      label: "Special!"
      effect: hero.acquireSpecial(random('bomb', 'saw'))
    rapid:
      label: "Rapid Fire!"
      duration: 6       # seconds
      effect: hero.rapidTimer = max(current, 6)
    shield:
      label: "+50 Shield"
      effect: hero.shield += 50
    clear:
      label: "PANIC CLEAR!"
      effect: deal 9999 damage to all live enemies
    energy:
      label: "+30 Energy"
      effect: hero.energy = min(maxEnergy, energy + 30)
    oneUp:
      label: "1UP!"
      effect: hero.lives += 1
